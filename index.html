function viewRunBody(title){
  const r=SES.run,q=curQ(r),it=ITEM[q.itemId],fb=r.fb;
  const pct=Math.round(progress(r)*100);
  const isBoss=SES.step==='boss'||SES.kind==='cp'&&SES.step==='test';
  let meta;
  if(r.o.requeue&&r.o.need(q.itemId)>1){
    const need=r.o.need(q.itemId),g=r.got[q.itemId];
    meta=`<span class="pips" aria-label="Đã đúng ${g}/${need} lần">${Array.from({length:need},(_,k)=>`<i class="${k<g?'on':''}"></i>`).join('')}</span>`;
  }else meta=`<span class="eyebrow">${isBoss?'Câu '+(r.steps+1)+'/'+r.o.ids.length:r.queue.length+' mục còn lại'}</span>`;
  const kindTag=it.t==='v'?'Từ vựng':'Ngữ pháp';
  let body=`<div class="q"><div class="q-meta"><span class="eyebrow">${kindTag} · ${esc(title)}</span>${meta}</div><div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div><p class="q-head">${esc(q.head)}</p><div class="q-prompt ${q.pcls}">${q.promptHtml}</div>`;
  if(q.kind==='mc'){
    body+=`<div class="opts ${q.cls}">${q.opts.map((o,i)=>{
      let c='';if(fb){c=o.ok?'is-ok':(fb.given===o.txt?'is-bad':'is-dim');}else if(r.sel===i)c='is-sel';
      return `<button class="opt ${c}" data-a="pick" data-i="${i}" ${fb?'disabled':''} aria-pressed="${!fb&&r.sel===i}"><span class="key">${LET[i]}</span><span class="otxt">${o.html}</span></button>`;}).join('')}</div>${!fb?`<button class="btn primary confirm" data-a="confirm" ${r.sel==null?'disabled':''}>${r.sel==null?'Chọn một đáp án':'Xác nhận đáp án '+LET[r.sel]}</button>`:''}`;
  }else if(!fb){
    body+=`<form class="type-form" data-form="type" autocomplete="off"><input id="ans" class="type-in" lang="ja" type="text" inputmode="text" enterkeyhint="done" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Cách đọc" placeholder="kazoku hoặc かぞく"><div class="type-prev" id="prev" aria-live="polite">${esc(toKana(q.draft||'',false))}</div>${q.hinted?`<div class="tip"><div class="tip-h">Gợi ý</div><p>${esc(ITEM[q.itemId].tip)}</p></div><p class="note-s">Đã dùng gợi ý nên lần này chỉ để tập, chưa được tính là một lần đúng.</p>`:''}<div class="row-btns"><button class="btn primary" type="submit">Kiểm tra</button>${!q.hinted&&SES.step!=='boss'&&!(SES.kind==='cp')?'<button class="btn line" type="button" data-a="hint">Gợi ý</button>':''}<button class="btn ghost" type="button" data-a="skip">Không biết</button></div></form>`;
  }else{
    body+=`<div class="type-prev" lang="ja" style="color:${fb.ok?'var(--ok)':'var(--bad)'}">${esc(fb.given)}</div>`;
  }
  body+='</div>';
  if(fb){
    const xp=fb.good?5:0;
    body+=`<div class="fb ${fb.ok?'ok':'bad'}" role="status"><div class="fb-h">${fb.ok?IC.check:IC.x}<span>${fb.ok?(fb.good?'Chính xác':'Đúng, nhưng bạn đã dùng gợi ý'):'Chưa đúng'}</span>${xp?`<span class="xp">+${xp} XP</span>`:''}</div>${!fb.ok?`<div class="fb-ans">${q.kind==='type'?`Bạn gõ: <b lang="ja">${esc(fb.given)}</b>. `:''}Đáp án: <b lang="ja">${esc(q.correctText)}</b></div>`:''}${revealHtml(q)}<button class="btn primary" data-a="next">${r.queue.length===1&&!(r.o.requeue&&(!fb.good||r.got[q.itemId]+1<r.o.need(q.itemId)))?'Xem kết quả':'Tiếp tục'}</button></div>`;
  }
  return body;
}
function viewGate(L){
  const n=levelItems(L.n).length,need=Math.ceil(PASS*n);
  const ps=SES.pstat;
  return `<section class="panel stack"><p class="eyebrow">Cửa qua màn</p><h2>Bài kiểm tra ${n} câu, cần đúng ${need} câu</h2><p class="muted">${ps?`Phần luyện tập: ${ps.ok}/${ps.total} mục đúng ngay lần đầu. `:''}Mỗi mục xuất hiện đúng một lần, không có gợi ý, và dạng câu hỏi trộn lẫn. Sai nhiều hơn ${n-need} câu thì phải luyện lại các mục sai.</p><button class="btn primary" data-a="gate-start">Bắt đầu kiểm tra</button></section>`;
}
function ring(pct,pass){
  const C=2*Math.PI*44,d=C*pct/100;
  return `<svg class="ring ${pass?'ok':'bad'}" viewBox="0 0 100 100" role="img" aria-label="${pct} phần trăm"><circle cx="50" cy="50" r="44" class="trk"/><circle cx="50" cy="50" r="44" class="val" stroke-dasharray="${d.toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 50 50)"/><text x="50" y="55" text-anchor="middle" class="rt">${pct}%</text></svg>`;
}
function rowHtml(x){
  const it=ITEM[x.id];
  const t=it.t==='v'?`<span lang="ja">${esc(it.jp)}</span>${it.kanji?` <small lang="ja" class="muted">${esc(it.kana)}</small>`:''}`:`<span lang="ja">${esc(it.ti)}</span>`;
  const q=it.t==='g'?`<div class="rw-q" lang="ja">${esc(x.promptText)}</div>`:(x.qt==='vi2jp'?`<div class="rw-q">Câu hỏi: ${esc(x.promptText)}</div>`:'');
  if(x.good)return `<li class="rw good"><span class="mk">${IC.check}</span><div><div class="rw-t">${t}</div>${q}<div class="rw-a">${it.t==='v'?esc(it.vi):esc(it.me)}</div></div></li>`;
  return `<li class="rw bad"><span class="mk">${IC.x}</span><div><div class="rw-t">${t}</div>${q}<div class="rw-a">Bạn chọn: <s lang="ja">${esc(x.given)}</s><br>Đáp án: <b lang="ja">${esc(x.correctText)}</b>${it.t==='v'?` · ${esc(it.vi)}`:''}</div>${tipHtml(it)}</div></li>`;
}
function viewSummary(res,o){
  const wrong=res.rows.filter(x=>!x.good),right=res.rows.filter(x=>x.good);
  const tab=SES.tab||(wrong.length?'wrong':'right');
  const list=tab==='wrong'?wrong:right;
  const extra=o.extra||'';
  return `<section class="panel stack"><div class="sum-top">${ring(res.pct,o.pass)}<div><h2>${esc(o.title)}</h2><p class="muted">${esc(o.sub)}</p><div class="sum-nums"><span class="g"><b>${right.length}</b> đúng</span><span class="r"><b>${wrong.length}</b> sai</span><span><b>${res.correct}/${res.total}</b> câu</span></div></div></div>${extra}</section>
  <div class="seg" role="tablist" style="margin-top:16px"><button role="tab" aria-selected="${tab==='wrong'}" class="${tab==='wrong'?'on':''}" data-a="sum-tab" data-t="wrong">Câu sai (${wrong.length})</button><button role="tab" aria-selected="${tab==='right'}" class="${tab==='right'?'on':''}" data-a="sum-tab" data-t="right">Câu đúng (${right.length})</button></div>
  ${list.length?`<ul class="rows" style="margin-top:12px">${list.map(rowHtml).join('')}</ul>`:`<div class="empty">${tab==='wrong'?'Không có câu sai nào. Rất tốt!':'Chưa có câu đúng nào.'}</div>`}
  <div class="row-btns" style="margin-top:16px">${o.btns||summaryBtns()}</div>`;
}
function summaryBtns(){
  if(SES.kind==='level')return SES.res.pass?'<button class="btn primary" data-a="to-reading">Làm bài đọc hiểu</button>':'<button class="btn primary" data-a="fix-start">Luyện lại mục sai</button>';
  return '';
}

/* ====== reading ====== */
function viewReading(L){
  const R=L.read,rd=SES.rd,all=rd.a.every(x=>x!==null),sc=rd.a.reduce((s,x,qi)=>s+(x!==null&&rd.opts[qi][x].ok?1:0),0);
  const tipHtml2=rd.tip?(()=>{const k=rd.tip,id='L'+SES.n+k;const it=ITEM[id];if(!it)return '';return it.t==='v'?`<b lang="ja">${esc(it.jp)}</b>${it.kanji?`（<span lang="ja">${esc(it.kana)}</span>）`:''}: ${esc(it.vi)}`:`<b lang="ja">${esc(it.ti)}</b>: ${esc(it.me)}`;})():'Chạm vào từ gạch chân để xem nghĩa. Vàng là từ vựng, xanh là ngữ pháp của màn này.';
  const qs=R.qs.map((q,qi)=>{
    const a=rd.a[qi];
    const sel=rd.sel[qi];
    const tr=a!==null?`<div class="rd-tr"><p><span class="eyebrow">Dịch câu hỏi</span><br>${esc(q.qv||'')}</p>${rd.opts[qi].map((o,i)=>o.v?`<p class="${o.ok?'tr-ok':a===i?'tr-bad':''}"><b>${LET[i]}.</b> ${esc(o.v)}${o.ok?' ✓':''}</p>`:'').join('')}</div>`:'';
    return `<div class="rd-q ${rd.furi?'':'nofuri'}"><p class="eyebrow">Câu ${qi+1}/${R.qs.length}</p><h3 lang="ja">${rich(q.q)}</h3><div class="opts">${rd.opts[qi].map((o,i)=>{
      let c='';if(a!==null){c=o.ok?'is-ok':(a===i?'is-bad':'is-dim');}else if(sel===i)c='is-sel';
      return `<button class="opt ${c}" data-a="rd-pick" data-q="${qi}" data-i="${i}" ${a!==null?'disabled':''}><span class="key">${LET[i]}</span><span class="otxt" lang="ja">${rich(o.t)}</span></button>`;}).join('')}</div>${a===null?`<button class="btn primary confirm" data-a="rd-confirm" data-q="${qi}" ${sel==null?'disabled':''}>${sel==null?'Chọn một đáp án':'Xác nhận đáp án '+LET[sel]}</button>`:''}${a!==null?`<div class="rd-why"><b>${rd.opts[qi][a].ok?'Đúng.':'Chưa đúng.'}</b> ${esc(q.w)}</div>${tr}`:''}</div>`;
  }).join('');
  const used=L.vocab.map((a,i)=>[a,i]).filter(([a,i])=>R.text.indexOf('[[v'+i+'|')>=0);
  const after=all?`<section class="panel stack"><h2>Bạn đúng ${sc}/${R.qs.length} câu hỏi</h2><div class="tr">${R.vi.split('\n').map(p=>`<p>${esc(p)}</p>`).join('')}</div><p class="eyebrow">Từ vựng xuất hiện trong bài</p><div class="chips">${used.map(([a])=>`<span class="pill"><span lang="ja">${esc(a[0])}</span>${a[0]!==a[1]?` <span lang="ja" class="muted">${esc(a[1])}</span>`:''} · ${esc(a[2])}</span>`).join('')}</div><div class="row-btns">${sc<2?'<button class="btn line" data-a="rd-retry">Đọc lại và trả lời lại</button>':''}<button class="btn primary" data-a="finish">Hoàn thành ga</button></div></section>`:'';
  return `<div class="stack"><section class="panel stack"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><p class="eyebrow">Bài đọc hiểu</p><h2 lang="ja" class="rd-title">${rich(R.title)}</h2></div><div class="toggle"><span id="fl">Furigana</span><button role="switch" aria-labelledby="fl" aria-pressed="${rd.furi}" data-a="furi"></button></div></div><div class="passage ${rd.furi?'':'nofuri'}">${R.text.split('\n').map(p=>`<p lang="ja">${rich(p)}</p>`).join('')}</div><div class="hl-tip" role="status">${tipHtml2}</div></section>${qs}${after}</div>`;
}
const rdOpts=R=>R.qs.map(q=>shuffle(q.o.map((t,k)=>({t,ok:k===0,v:q.ov?q.ov[k]:''}))));
function startReading(){
  const R=LV[SES.n-1].read;
  SES.rd={a:R.qs.map(()=>null),sel:R.qs.map(()=>null),opts:rdOpts(R),furi:true,tip:null};
  SES.step='reading';go();
}

/* ====== level done ====== */
function finishLevel(){
  const n=SES.n,old=S.lv[n]||{};
  const sc=SES.rd.a.reduce((s,x,qi)=>s+(SES.rd.opts[qi][x].ok?1:0),0);
  const fp=SES.firstPct||0;
  let st=SES.att===1?(fp===100?3:fp>=90?2:1):1;
  if(old.st)st=Math.max(st,old.st);
  S.lv[n]={learned:1,done:1,st,pct:SES.res.pct,at:now(),att:SES.att,rd:[sc,SES.rd.a.length]};
  award(30+sc*5);save();
  SES.stars=st;SES.rdScore=sc;SES.step='done';go();
}
function viewDone(L){
  const ph=phaseOf(L.n);
  const nt=nextTarget();
  let nextBtn='';
  if(nt&&nt.t==='level')nextBtn=`<button class="btn primary" data-a="open-level" data-n="${nt.n}">Ga tiếp theo: ${esc(LV[nt.n-1].title)}</button>`;
  else if(nt&&nt.t==='cp')nextBtn=`<button class="btn primary" data-a="open-cp" data-k="${nt.k}">Làm kiểm tra định kỳ</button>`;
  return `<div class="stack" style="--lc:var(${ph.c})"><section class="card done-card"><div class="stamp" lang="ja">${pad(L.n)}</div><p class="eyebrow">Hoàn thành</p><h2>Ga ${pad(L.n)} · ${esc(L.title)}</h2>${starsHtml(SES.stars)}<p class="muted">Bài kiểm tra ${SES.res.correct}/${SES.res.total} · bài đọc ${SES.rdScore}/${L.read.qs.length}${SES.att>1?' · làm '+SES.att+' lần':''}</p>${nt&&nt.t==='cp'?`<p>Kiểm tra định kỳ sẽ mở ga tiếp theo. Bài này ôn lại cả hai ga vừa học.</p>`:''}<div class="row-btns" style="width:100%">${nextBtn}<button class="btn line" data-a="exit-yes">Về tuyến học</button></div></section></div>`;
}

/* ====== checkpoint ====== */
function cpIds(k){
  const learned=Object.keys(S.it).filter(id=>ITEM[id]&&ITEM[id].n<=k);
  const sc=id=>{const r=S.it[id];return (r.l||0)*2+(5-r.b)+Math.random()*3;};
  const recent=learned.filter(id=>ITEM[id].n>k-2).sort((a,b)=>sc(b)-sc(a));
  const older=learned.filter(id=>ITEM[id].n<=k-2).sort((a,b)=>sc(b)-sc(a));
  const nr=Math.min(recent.length,older.length?10:16),no=Math.min(older.length,16-nr);
  return shuffle(recent.slice(0,nr).concat(older.slice(0,no)));
}
function viewCp(){
  const k=SES.k,t='Kiểm tra định kỳ · Ga 1–'+k;
  if(SES.step==='intro'){
    const n=cpIds(k).length;
    return `<div class="ses-top"><button class="btn ghost sm" data-a="exit">${IC.back} Về tuyến</button></div><section class="panel stack"><p class="eyebrow">Kiểm tra định kỳ</p><h1 style="font:800 1.6rem/1.25 var(--f-ui)">Ôn lại Ga 1–${k}</h1><p class="muted">Cứ hai ga học xong là có một bài kiểm tra trộn các từ và mẫu ngữ pháp đã học, ưu tiên những mục bạn hay quên. Gồm tối đa 16 câu, không có gợi ý. Cần đúng từ 80% để mở ga tiếp theo.</p><div class="pills"><span class="pill">${n} câu</span><span class="pill">đạt từ ${Math.ceil(PASS*n)} câu</span></div><button class="btn primary" data-a="cp-start">Bắt đầu</button></section>`;
  }
  if(SES.step==='test')return frame(t,null,viewRunBody('Kiểm tra định kỳ'));
  if(SES.step==='fix')return frame(t,null,viewRunBody('Luyện lại các mục sai'));
  if(SES.step==='summary'){
    const res=SES.res;
    return frame(t,null,viewSummary(res,{pass:res.pass,title:res.pass?'Đã qua kiểm tra định kỳ':'Chưa qua kiểm tra định kỳ',sub:res.pass?'Ga tiếp theo đã mở. Các mục sai đã được xếp lịch ôn sớm.':`Cần đúng ít nhất ${Math.ceil(PASS*res.total)}/${res.total} câu. Luyện lại các mục sai rồi làm lại.`,btns:res.pass?'<button class="btn primary" data-a="exit-yes">Về tuyến học</button>':'<button class="btn primary" data-a="cp-fix">Luyện lại mục sai</button>'}));
  }
  return '';
}
function startCpTest(){
  const ids=cpIds(SES.k);
  SES.run=mkRun({ids,qm:'cp',need:()=>1,requeue:false,max:SES.k});
  SES.step='test';go();
}
function finishCp(){
  const res=summarize(SES.run);
  res.pass=res.correct>=Math.ceil(PASS*res.total);
  res.rows.forEach(x=>srsMark(x.id,x.good));
  if(res.pass){S.cp[SES.k]={pass:1,pct:res.pct,at:now()};award(30);}
  save();SES.res=res;SES.tab=res.rows.some(x=>!x.good)?'wrong':'right';SES.step='summary';
}

/* ====== review / drill ====== */
function rvIds(m,n){
  let ids;
  if(m==='due')ids=dueIds().slice(0,15);
  else if(m==='weak'){const sc=id=>{const r=S.it[id];return (r.l||0)*2+(5-r.b)+(r.w||0)*.2;};ids=Object.keys(S.it).filter(id=>ITEM[id]).sort((a,b)=>sc(b)-sc(a)).slice(0,12);}
  else ids=levelItems(n).filter(id=>S.it[id]);
  return shuffle(ids);
}
function startReview(m,n){
  const ids=rvIds(m,n);
  if(!ids.length){UI.rv='none';render();return;}
  SES={kind:'rv',m,n,step:'run',confirm:false,tab:'wrong'};
  SES.run=mkRun({ids,qm:'box',need:()=>1,requeue:true,max:learnedMax()});
  go();
}
function viewRv(){
  const t=SES.m==='due'?'Ôn tập đến hạn':SES.m==='weak'?'Luyện mục hay sai':'Luyện lại Ga '+pad(SES.n);
  if(SES.step==='run')return frame(t,null,viewRunBody(t));
  const res=SES.res;
  return frame(t,null,viewSummary(res,{pass:res.pct>=80,title:res.pct>=80?'Ôn tập tốt':'Cần ôn thêm',sub:`Đúng ngay lần đầu ${res.correct}/${res.total} mục. Mục đúng được dời lịch ôn xa hơn, mục sai sẽ quay lại sớm.`,btns:'<button class="btn primary" data-a="exit-yes">Xong</button>'}));
}
function finishReview(){
  const res=summarize(SES.run);
  res.rows.forEach(x=>srsMark(x.id,x.good));
  award(10);save();SES.res=res;SES.tab=res.rows.some(x=>!x.good)?'wrong':'right';SES.step='summary';
}

function viewReview(){
  const ids=Object.keys(S.it).filter(id=>ITEM[id]);
  const due=dueIds().length;
  const g={n:0,l:0,s:0};
  ids.forEach(id=>{const b=S.it[id].b;if(b<=1)g.n++;else if(b<=3)g.l++;else g.s++;});
  const tot=ids.length||1,t=now();
  const cnt=f=>ids.filter(id=>f(S.it[id].d-t)).length;
  const c0=cnt(d=>d<=0),c1=cnt(d=>d>0&&d<=DAY),c2=cnt(d=>d>DAY&&d<=7*DAY),c3=cnt(d=>d>7*DAY);
  const doneLv=LV.filter(L=>S.lv[L.n]&&S.lv[L.n].learned);
  const weakN=ids.filter(weak).length;
  return `<div class="stack"><section class="panel stack"><p class="eyebrow">Ôn tập ngắt quãng</p>${ids.length?`<div class="due-card"><div><div class="big-n">${due}</div><div class="muted">mục đến hạn ôn</div></div><div class="row-btns" style="flex:1 1 220px"><button class="btn primary" data-a="rv-start" data-m="due" ${due?'':'disabled'}>Ôn ngay</button><button class="btn line" data-a="rv-start" data-m="weak" ${weakN?'':'disabled'}>Luyện mục hay sai (${weakN})</button></div></div>${UI.rv==='none'?'<p class="note-s">Chưa có mục nào để ôn.</p>':''}<p class="note-s">Mục đúng sẽ xuất hiện lại sau 1, 3, 7, 14 rồi 30 ngày. Mục sai quay lại ngay.</p>`:`<h2>Chưa có gì để ôn</h2><p class="muted">Học xong phần thẻ của một ga là các mục xuất hiện ở đây.</p>`}</section>
  ${ids.length?`<section class="panel stack"><h3>Mức nhớ của ${ids.length} mục đã học</h3><div class="mast" role="img" aria-label="Mới ${g.n}, đang nhớ ${g.l}, vững ${g.s}"><i style="width:${100*g.n/tot}%;background:var(--bad)"></i><i style="width:${100*g.l/tot}%;background:var(--tip-dot)"></i><i style="width:${100*g.s/tot}%;background:var(--ok)"></i></div><div class="legend"><span style="--c:var(--bad)">Mới ${g.n}</span><span style="--c:var(--tip-dot)">Đang nhớ ${g.l}</span><span style="--c:var(--ok)">Vững ${g.s}</span></div><div class="sched"><div><b>${c0}</b>đến hạn bây giờ</div><div><b>${c1}</b>trong 24 giờ tới</div><div><b>${c2}</b>trong 2–7 ngày</div><div><b>${c3}</b>sau hơn 7 ngày</div></div></section>`:''}
  ${doneLv.length?`<section class="panel stack"><h3>Luyện lại một ga</h3><div class="lvl-list">${doneLv.map(L=>`<button class="btn line" data-a="rv-start" data-m="level" data-n="${L.n}"><span>Ga ${pad(L.n)} · ${esc(L.title)}</span></button>`).join('')}</div></section>`:''}</div>`;
}

/* ====== notebook ====== */
function matchItem(id){
  const it=ITEM[id],r=S.it[id],q=UI.nq.trim().toLowerCase();
  if(UI.nf==='weak'&&!weak(id))return false;
  if(UI.nf==='due'&&!(r.d<=now()))return false;
  if(!q)return true;
  const hay=(it.t==='v'?[it.jp,it.kana,it.vi,it.hv||'']:[it.ti,it.me,it.fo]).join(' ').toLowerCase();
  return hay.indexOf(q)>=0||normK(q)&&hay.indexOf(normK(q))>=0;
}
function itemRow(id){
  const it=ITEM[id],r=S.it[id],isDue=r.d<=now();
  const dots=`<span class="mdots ${isDue?'due':''}" aria-label="Mức nhớ ${r.b}/5">${[1,2,3,4,5].map(k=>`<i class="${k<=r.b?'on':''}"></i>`).join('')}</span>`;
  if(it.t==='v')return `<details class="it"><summary><span class="it-jp" lang="ja">${esc(it.jp)}${it.kanji?`<small>${esc(it.kana)}</small>`:''}</span><span class="it-vi">${esc(it.vi)}</span>${dots}</summary><div class="it-b">${it.hv?`<div class="chips"><span class="pill hv">Hán Việt · ${esc(it.hv)}</span></div>`:''}${tipHtml(it)}<div class="ex-i"><p lang="ja">${esc(it.ex)} ${spkBtn(it.ex)}</p><p>${esc(it.exVi)}</p></div></div></details>`;
  return `<details class="it"><summary><span class="it-jp" lang="ja">${esc(it.ti)}</span><span class="it-vi">${esc(it.me)}</span>${dots}</summary><div class="it-b"><div class="g-form" lang="ja">${esc(it.fo)}</div>${tipHtml(it)}<div class="ex">${it.ex.map(e=>`<div class="ex-i"><p lang="ja">${esc(e[0])} ${spkBtn(e[0])}</p><p>${esc(e[1])}</p></div>`).join('')}</div>${it.wa?`<div class="warn"><b>Dễ nhầm:</b> ${esc(it.wa)}</div>`:''}</div></details>`;
}
function notesList(){
  let h='',any=false;
  LV.forEach(L=>{
    const ph=phaseOf(L.n);
    const ids=levelItems(L.n).filter(id=>S.it[id]);
    if(!ids.length){ if(!UI.nq&&UI.nf==='all')h+=`<div class="lock-row">${IC.lock}<span>Ga ${pad(L.n)} · ${esc(L.title)} (chưa học)</span></div>`; return; }
    const shown=ids.filter(matchItem);
    if(!shown.length)return;
    any=true;
    h+=`<details class="lv" style="--lc:var(${ph.c})" ${UI.nq||UI.nf!=='all'?'open':''}><summary><span class="lv-c"></span><span>Ga ${pad(L.n)} · ${esc(L.title)}<br><span class="lv-sub">${shown.length} mục</span></span></summary><div class="lv-body">${shown.map(itemRow).join('')}</div></details>`;
  });
  if(!any&&(UI.nq||UI.nf!=='all'))h+='<div class="empty">Không có mục nào khớp.</div>';
  if(!Object.keys(S.it).length)h='<div class="empty">Sổ tay còn trống. Học xong phần thẻ của Ga 1 là các mục xuất hiện ở đây.</div>'+h;
  return h;
}
function viewNotes(){
  const f=(k,t)=>`<button data-a="nf" data-f="${k}" class="${UI.nf===k?'on':''}" aria-pressed="${UI.nf===k}">${t}</button>`;
  return `<div class="stack"><section class="stack"><h1 style="font:800 1.5rem/1.3 var(--f-ui)">Sổ tay</h1><input id="nq" class="srch" type="search" placeholder="Tìm từ, cách đọc, nghĩa hoặc mẫu ngữ pháp" value="${esc(UI.nq)}" aria-label="Tìm trong sổ tay"><div class="flt">${f('all','Tất cả')}${f('weak','Hay sai')}${f('due','Đến hạn')}</div></section><div class="stack" id="nlist">${notesList()}</div>
  <section class="panel flat stack"><h3>Dữ liệu</h3><p class="note-s">${CLOUD.ok?'Tiến độ được lưu vào tài khoản của bạn và cả trên trình duyệt này.':'Tiến độ chỉ lưu trên trình duyệt này. Xóa dữ liệu trình duyệt sẽ mất tiến độ.'}</p>${UI.resetAsk?`<p><b>Xóa toàn bộ tiến độ và bắt đầu lại từ Ga 01?</b></p><div class="row-btns"><button class="btn line" data-a="reset-no">Giữ lại</button><button class="btn danger" data-a="reset-yes">Xóa hết</button></div>`:`<button class="btn line sm" style="align-self:flex-start" data-a="reset-ask">Xóa tiến độ</button>`}</section></div>`;
}

/* ====== actions ====== */
function openLevel(n){SES={kind:'level',n,step:'intro',card:0,att:0,tab:'wrong',confirm:false};go();}
function startPractice(ids,step){
  SES.run=mkRun({ids:ids||levelItems(SES.n),qm:'stage',need:id=>NEED[ITEM[id].t],requeue:true,max:SES.n});
  SES.step=step||'practice';go();
}
function onRunEnd(){
  if(SES.kind==='level'){
    if(SES.step==='practice'){const s=summarize(SES.run);SES.pstat={ok:s.correct,total:s.total};SES.step='gate';}
    else if(SES.step==='fix'){SES.step='gate';}
    else if(SES.step==='boss'){
      const res=summarize(SES.run);
      SES.att++;res.pass=res.correct>=Math.ceil(PASS*res.total);
      if(SES.att===1)SES.firstPct=res.pct;
      res.rows.forEach(x=>srsMark(x.id,x.good));
      if(res.pass)award(20);
      save();SES.res=res;SES.tab=res.rows.some(x=>!x.good)?'wrong':'right';SES.step='summary';
    }
  }else if(SES.kind==='cp'){
    if(SES.step==='test')finishCp();
    else if(SES.step==='fix')startCpTest();
  }else if(SES.kind==='rv')finishReview();
}
function act(a,el){
  const d=el.dataset;
  switch(a){
    case 'tab':UI.tab=d.t;UI.rv=null;go();break;
    case 'open-level':openLevel(+d.n);break;
    case 'open-cp':SES={kind:'cp',k:+d.k,step:'intro',confirm:false,tab:'wrong'};go();break;
    case 'exit':
      if(SES.step==='intro'){SES=null;go();}
      else{SES.confirm=true;render();}
      break;
    case 'exit-no':SES.confirm=false;render();break;
    case 'exit-yes':SES=null;go();break;
    case 'learn-start':SES.step='learn';SES.card=0;go();autoSay();break;
    case 'practice-start':startPractice();break;
    case 'card-prev':if(SES.card>0){SES.card--;go();autoSay();}break;
    case 'card-next':SES.card++;go();autoSay();break;
    case 'learn-done':{
      levelItems(SES.n).forEach(id=>rec(id));
      S.lv[SES.n]=Object.assign(S.lv[SES.n]||{},{learned:1});touchDay();save();startPractice();break;}
    case 'speak':speak(d.t);break;
    case 'pick':{const r=SES.run;if(r&&!r.fb){r.sel=+d.i;render();const b=$('[data-a="confirm"]');if(b)b.focus({preventScroll:true});}break;}
    case 'confirm':{const r=SES.run;if(r&&!r.fb&&r.sel!=null){answer(r,r.sel);r.sel=null;render();}break;}
    case 'hint':{const q=SES.run.cur;if(q){q.hinted=true;const i=$('#ans');if(i)q.draft=i.value;render();}break;}
    case 'skip':answer(SES.run,null);render();break;
    case 'next':{const r=SES.run;if(r&&r.fb){const end=advance(r);if(end)onRunEnd();go();}break;}
    case 'gate-start':SES.run=mkRun({ids:levelItems(SES.n),qm:'boss',need:()=>1,requeue:false,max:SES.n});SES.step='boss';go();break;
    case 'sum-tab':SES.tab=d.t;render();break;
    case 'fix-start':{
      const ids=SES.res.rows.filter(x=>!x.good).map(x=>x.id);
      startPractice(ids,'fix');break;}
    case 'to-reading':startReading();break;
    case 'cp-start':startCpTest();break;
    case 'cp-fix':{
      const ids=SES.res.rows.filter(x=>!x.good).map(x=>x.id);
      SES.run=mkRun({ids,qm:'rand',need:()=>1,requeue:true,max:SES.k});SES.step='fix';go();break;}
    case 'rv-start':startReview(d.m,+d.n);break;
    case 'furi':SES.rd.furi=!SES.rd.furi;render();break;
    case 'hl':SES.rd.tip=d.k;render();break;
    case 'rd-pick':{const qi=+d.q;if(SES.rd.a[qi]===null){SES.rd.sel[qi]=+d.i;render();}break;}
    case 'rd-confirm':{const qi=+d.q,i=SES.rd.sel[qi];if(SES.rd.a[qi]===null&&i!=null){SES.rd.a[qi]=i;if(SES.rd.opts[qi][i].ok)award(5);save();render();}break;}
    case 'rd-retry':{const R=LV[SES.n-1].read;SES.rd.a=R.qs.map(()=>null);SES.rd.sel=R.qs.map(()=>null);SES.rd.opts=rdOpts(R);go();break;}
    case 'finish':finishLevel();break;
    case 'nf':UI.nf=d.f;render();break;
    case 'reset-ask':UI.resetAsk=true;render();break;
    case 'reset-no':UI.resetAsk=false;render();break;
    case 'reset-yes':S=fresh();save();UI.resetAsk=false;UI.tab='learn';go();break;
  }
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el||el.disabled)return;
  act(el.dataset.a,el);
});
document.addEventListener('submit',e=>{
  if(e.target.matches('form[data-form="type"]')){
    e.preventDefault();submitTyped();
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='ans'){
    const q=SES&&SES.run&&SES.run.cur;if(q)q.draft=e.target.value;
    const p=$('#prev');if(p)p.textContent=toKana(e.target.value,false);
  }else if(e.target.id==='nq'){
    UI.nq=e.target.value;const l=$('#nlist');if(l)l.innerHTML=notesList();
  }
});
function submitTyped(){const r=SES&&SES.run;const i=$('#ans');if(!r||r.fb||!i)return;answer(r,i.value);render();}
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t&&t.id==='ans'&&e.key==='Enter'){
    if(e.isComposing||e.keyCode===229)return; // bộ gõ tiếng Nhật: Enter đầu chỉ chốt chữ kana
    e.preventDefault();submitTyped();return;
  }
  if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;
  if(SES&&SES.run&&e.key==='Enter'&&!(t&&t.tagName==='BUTTON')){
    const r=SES.run;
    if(r.fb){e.preventDefault();act('next',t);return;}
    if(r.sel!=null){e.preventDefault();act('confirm',t);return;}
  }
  if(t&&t.classList&&t.classList.contains('hl')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();act('hl',t);return;}
  if(!SES)return;
  if(SES.run&&SES.run.cur&&!SES.run.fb&&SES.run.cur.kind==='mc'&&/^[1-4]$/.test(e.key)){
    const i=+e.key-1;if(SES.run.cur.opts[i]){SES.run.sel=i;render();}
  }
  if(SES.kind==='level'&&SES.step==='learn'){
    if(e.key==='ArrowRight'&&SES.card<levelItems(SES.n).length-1){SES.card++;go();}
    if(e.key==='ArrowLeft'&&SES.card>0){SES.card--;go();}
  }
});

/* ====== init ====== */
try{initVoice();if(hasSpeech())speechSynthesis.onvoiceschanged=initVoice;}catch(e){}
if(window.__DOJO_TEST__)window.__dojo={get S(){return S;},get SES(){return SES;},ITEM,LV,levelItems,toKana,normK,romaji,UI,cpIds,dueIds,rec,set S(v){S=v;}};
render();
cloudInit();
})();

</script>

<script>
(function(){
  if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
  var standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  var dismissed=false;try{dismissed=localStorage.getItem('dojo-install-x')==='1';}catch(e){}
  if(standalone||dismissed)return;
  var bar=document.getElementById('install'),t=document.getElementById('install-t'),go=document.getElementById('install-go'),deferred=null;
  document.getElementById('install-x').onclick=function(){bar.hidden=true;try{localStorage.setItem('dojo-install-x','1');}catch(e){}};
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios){t.textContent='Cài app: bấm nút Chia sẻ của Safari rồi chọn "Thêm vào MH chính".';bar.hidden=false;}
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;t.textContent='Cài Dojo N4 lên điện thoại để mở nhanh và học cả khi không có mạng.';go.hidden=false;bar.hidden=false;});
  go.onclick=function(){if(!deferred)return;deferred.prompt();deferred.userChoice.finally(function(){deferred=null;bar.hidden=true;});};
  window.addEventListener('appinstalled',function(){bar.hidden=true;});
})();
</script>
