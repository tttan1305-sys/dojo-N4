<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F4FD6">
<meta name="description" content="Học từ vựng và ngữ pháp tiếng Nhật N5 lên N4: phải nhớ mới qua màn, có mẹo nhớ, bài đọc hiểu và kiểm tra định kỳ.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dojo N4">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
img{max-width:100%}[hidden]{display:none!important}
#install{position:relative;z-index:50;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:#FFD43B;color:#0F1F3A;font:600 14px/1.35 "Be Vietnam Pro",system-ui,sans-serif}
#install p{margin:0;flex:1;min-width:0}
#install button{border:0;border-radius:10px;padding:8px 12px;font:700 14px "Be Vietnam Pro",system-ui,sans-serif;background:#0F1F3A;color:#fff}
#install button.x{background:transparent;color:#0F1F3A;padding:8px}
</style>
</head>
<body>
<div id="install" hidden><p id="install-t"></p><button id="install-go" hidden>Cài đặt</button><button class="x" id="install-x" aria-label="Đóng">✕</button></div>
<title>Dojo Tiếng Nhật N4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* Layout: a station-signage world. Home is a vertical metro line (16 stations in 4 colored lines, one checkpoint after every 2nd station);
   every game screen is one focused card in a 720px column. Mnemonics sit on a tactile-paving strip (yellow dots). */
:root{
  --bg:#E8EEF7; --surface:#FFFFFF; --surface-2:#F1F5FA; --ink:#0F1F3A; --ink-2:#43577A; --ink-3:#7A8BA6;
  --line:#D0DBEA; --accent:#1F4FD6; --accent-ink:#FFFFFF; --accent-soft:#DCE6FF;
  --ok:#147A47; --ok-soft:#DCF3E6; --bad:#B92D2D; --bad-soft:#FBE3E3;
  --tip-bg:#FFF2C7; --tip-ink:#4A3700; --tip-dot:#E3A200;
  --l1:#0E9470; --l2:#C97300; --l3:#7C4DEB; --l4:#D63F8C; --on-line:#FFFFFF;
  --hl-v:rgba(227,162,0,.38); --hl-g:rgba(31,79,214,.24);
  --shadow:0 1px 0 rgba(15,31,58,.05),0 10px 26px -14px rgba(15,31,58,.35);
  --f-ui:'Be Vietnam Pro','Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',Meiryo,system-ui,sans-serif;
  --f-jp:'Zen Kaku Gothic New','Be Vietnam Pro','Hiragino Sans','Yu Gothic',Meiryo,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1426; --surface:#12203A; --surface-2:#182A4B; --ink:#E8EFFA; --ink-2:#A5B5D0; --ink-3:#7587A6;
    --line:#26385C; --accent:#7FA8FF; --accent-ink:#0A1426; --accent-soft:#1D3366;
    --ok:#52C98E; --ok-soft:#10382B; --bad:#FF8383; --bad-soft:#41191E;
    --tip-bg:#2D2610; --tip-ink:#F6DF92; --tip-dot:#E3A200;
    --l1:#2DD4A4; --l2:#FFB547; --l3:#A98BFF; --l4:#FF74B3; --on-line:#0A1426;
    --hl-v:rgba(255,190,40,.34); --hl-g:rgba(127,168,255,.34);
    --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1426; --surface:#12203A; --surface-2:#182A4B; --ink:#E8EFFA; --ink-2:#A5B5D0; --ink-3:#7587A6;
  --line:#26385C; --accent:#7FA8FF; --accent-ink:#0A1426; --accent-soft:#1D3366;
  --ok:#52C98E; --ok-soft:#10382B; --bad:#FF8383; --bad-soft:#41191E;
  --tip-bg:#2D2610; --tip-ink:#F6DF92; --tip-dot:#E3A200;
  --l1:#2DD4A4; --l2:#FFB547; --l3:#A98BFF; --l4:#FF74B3; --on-line:#0A1426;
  --hl-v:rgba(255,190,40,.34); --hl-g:rgba(127,168,255,.34);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--f-ui);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;line-height:1.25}
.muted{color:var(--ink-2)}
.eyebrow{font:700 .72rem/1.3 var(--f-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
[lang="ja"]{font-family:var(--f-jp)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:720px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.sign{flex:none;display:grid;place-items:center;height:30px;min-width:42px;padding:0 8px;border-radius:7px;background:var(--accent);color:var(--accent-ink);font:900 .95rem/1 var(--f-jp);letter-spacing:.02em;box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 0 3.5px color-mix(in srgb,var(--accent-ink) 85%,transparent)}
.brand-t{font:800 1.02rem/1.1 var(--f-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:8px;flex-wrap:nowrap}
.stat{display:inline-flex;align-items:baseline;gap:4px;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font:600 .78rem/1.2 var(--f-ui);color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.stat b{font-weight:800;color:var(--ink);font-size:.9rem}

.wrap{padding-top:18px;padding-bottom:40px}
.wrap.has-tabs{padding-bottom:104px}
.stack{display:flex;flex-direction:column;gap:16px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:12px;border:2px solid transparent;font:700 .98rem/1.2 var(--f-ui);text-align:center;transition:transform .06s,background .12s,border-color .12s}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.07)}
.btn.line{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.line:hover:not(:disabled){border-color:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink-2)}
.btn.ghost:hover:not(:disabled){color:var(--ink);background:var(--surface-2)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.88rem;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.row-btns .btn{flex:1 1 160px}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--accent)}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn svg{width:20px;height:20px}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.panel.flat{box-shadow:none}
.panel h2{font:800 1.2rem/1.3 var(--f-ui)}
.panel h3{font:700 1rem/1.3 var(--f-ui)}

/* home: today */
.today{display:grid;gap:14px}
.today-go{display:flex;flex-direction:column;gap:10px}
.today-go h2{font:800 1.45rem/1.25 var(--f-ui)}
.due-card{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.due-n{font:900 2rem/1 var(--f-ui);font-variant-numeric:tabular-nums}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font:600 .78rem/1.4 var(--f-ui);color:var(--ink-2)}
.pill.hv{background:var(--accent-soft);border-color:transparent;color:var(--ink)}

/* route */
.phase{--lc:var(--l1);margin-top:28px}
.phase-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.phase-tag{padding:3px 9px;border-radius:6px;background:var(--lc);color:var(--on-line);font:800 .7rem/1.4 var(--f-ui);letter-spacing:.08em;text-transform:uppercase}
.phase-h h2{font:800 1.05rem/1.3 var(--f-ui)}
.phase-h .muted{font-size:.85rem}
.line{list-style:none;margin:0;padding:0;position:relative}
.line::before{content:"";position:absolute;left:35px;top:28px;bottom:28px;width:4px;border-radius:2px;background:var(--lc);opacity:.5}
.stn{position:relative}
.stn-b{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;padding:10px 14px 10px 13px;margin:2px 0;border:1.5px solid transparent;border-radius:16px;background:transparent}
.stn.open .stn-b{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.stn.open .stn-b:hover{border-color:var(--lc)}
.stn.locked .stn-b{cursor:not-allowed}
.node{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:4px solid var(--lc);background:var(--surface);font:800 1.05rem/1 var(--f-jp);font-variant-numeric:tabular-nums}
.node svg{width:20px;height:20px}
.stn.done .node{background:var(--lc);color:var(--on-line)}
.stn.locked .node{border-color:var(--line);background:var(--surface-2);color:var(--ink-3)}
.stn-t{display:flex;flex-direction:column;gap:1px;min-width:0}
.stn-code{font:700 .7rem/1.4 var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.stn-t strong{font:700 1.02rem/1.3 var(--f-ui)}
.stn.locked .stn-t strong{color:var(--ink-2)}
.stn-t .muted{font-size:.84rem}
.stars{display:inline-flex;gap:1px;color:var(--tip-dot)}
.stars svg{width:18px;height:18px}
.stars .off{color:var(--line)}
.cpn .node{border-radius:10px;transform:rotate(45deg);width:34px;height:34px;margin:5px;border-style:solid}
.cpn .node>*{transform:rotate(-45deg)}
.cpn .stn-b{border:1.5px dashed var(--line);background:var(--surface-2);padding-top:8px;padding-bottom:8px;margin:6px 0}
.cpn.open .stn-b{border-style:solid;border-color:var(--accent);background:var(--surface)}
.cpn.done .stn-b{background:transparent}
.cpn .node{border-color:var(--ink-3);background:var(--surface)}
.cpn.done .node{background:var(--ok);border-color:var(--ok);color:#fff}
.cpn.open .node{border-color:var(--accent);color:var(--accent)}
.cpn .stn-code{color:var(--accent)}
.cpn.locked .stn-code{color:var(--ink-3)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{display:grid;grid-template-columns:repeat(3,1fr);max-width:720px;margin:0 auto}
.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 6px 8px;border:0;background:none;color:var(--ink-2);font:700 .72rem/1.2 var(--f-ui)}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--accent)}
.tabs button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;padding:0 5px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font:800 .68rem/18px var(--f-ui);text-align:center;font-style:normal}

/* session frame */
.ses-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ses-title{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.stepper{display:flex;gap:4px;list-style:none;margin:0;padding:0}
.stepper li{flex:1;height:6px;border-radius:3px;background:var(--line);font-size:0;position:relative}
.stepper li.past{background:var(--accent);opacity:.55}
.stepper li.now{background:var(--accent)}
.stepper-l{display:flex;justify-content:space-between;font:700 .66rem/1.2 var(--f-ui);color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase}
.stepper-l .on{color:var(--accent)}
.rd-title{line-height:2;margin-top:2px}
.confirm{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--bad-soft);border:1.5px solid var(--bad);margin-bottom:14px}
.confirm p{font-size:.9rem;flex:1 1 220px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .25s}

/* learn cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.jp-big{font:900 clamp(3rem,15vw,4.8rem)/1.1 var(--f-jp);overflow-wrap:anywhere;text-align:center}
.kana-row{display:flex;align-items:center;justify-content:center;gap:10px;font:700 1.45rem/1.3 var(--f-jp)}
.meaning{font:800 1.4rem/1.3 var(--f-ui);text-align:center;text-wrap:balance}
.g-title{font:900 2.2rem/1.2 var(--f-jp);text-align:center}
.g-form{align-self:center;padding:6px 14px;border-radius:10px;background:var(--accent-soft);font:700 .98rem/1.4 var(--f-jp);text-align:center}
.ex{display:flex;flex-direction:column;gap:10px}
.ex-i{padding-left:12px;border-left:3px solid var(--line)}
.ex-i p:first-child{font:500 1.08rem/1.7 var(--f-jp)}
.ex-i p:last-child{font-size:.9rem;color:var(--ink-2)}
.warn{padding:10px 14px;border-radius:12px;background:var(--bad-soft);font-size:.92rem}
.warn b{color:var(--bad)}
.tip{position:relative;padding:12px 14px 12px 44px;border-radius:12px;background:var(--tip-bg);color:var(--tip-ink);overflow:hidden}
.tip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:30px;background:radial-gradient(circle at 15px 15px,var(--tip-dot) 4.5px,transparent 5px) 0 0/30px 30px repeat-y;border-right:2px solid var(--tip-dot)}
.tip-h{font:800 .7rem/1.4 var(--f-ui);letter-spacing:.09em;text-transform:uppercase;margin-bottom:2px}
.tip p{font-size:.96rem;line-height:1.55}
.nav-row{display:flex;gap:10px;margin-top:14px}
.nav-row .btn{flex:1}
.dots{display:flex;gap:5px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.dots i.g{border-radius:3px}

/* question */
.q{display:flex;flex-direction:column;gap:10px}
.q-meta{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pips{display:inline-flex;gap:4px}
.pips i{width:10px;height:10px;border-radius:50%;border:2px solid var(--accent)}
.pips i.on{background:var(--accent)}
.q-head{font:700 1rem/1.4 var(--f-ui);color:var(--ink-2)}
.q-prompt{padding:14px 6px 8px;text-align:center;overflow-wrap:anywhere}
.q-prompt.jp{font:900 clamp(2.8rem,13vw,4.2rem)/1.15 var(--f-jp)}
.q-prompt.vi{font:800 1.7rem/1.3 var(--f-ui);text-wrap:balance}
.q-prompt.sent{font:700 1.3rem/1.75 var(--f-jp);text-align:left;white-space:pre-line}
.blank{display:inline-block;min-width:3.4em;height:1.1em;border-bottom:3px solid var(--accent);margin:0 .2em;transform:translateY(.18em)}
.opts{display:grid;gap:10px;margin-top:6px}
@media (min-width:620px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:center;text-align:left;min-height:58px;padding:10px 14px 10px 10px;border-radius:14px;background:var(--surface);border:2px solid var(--line);transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .key{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font:800 .85rem/1 var(--f-ui);background:var(--surface-2);border:1.5px solid var(--line);color:var(--ink-2)}
.opt .otxt{min-width:0;overflow-wrap:anywhere;font-weight:600}
.opt .jp-opt{display:block;font:700 1.35rem/1.35 var(--f-jp)}
.opt small{display:block;font-size:.85rem;color:var(--ink-2);font-family:var(--f-jp)}
.opt.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-ok .key{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.is-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.is-bad .key{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.is-dim{opacity:.5}
.type-form{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.type-in{width:100%;min-height:58px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font:700 1.5rem/1.3 var(--f-jp);text-align:center}
.type-in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.type-prev{min-height:1.6em;text-align:center;font:700 1.15rem/1.5 var(--f-jp);color:var(--accent)}
.type-hint{font-size:.92rem}

/* feedback */
.fb{margin-top:14px;padding:14px 16px;border-radius:16px;border:2px solid;display:flex;flex-direction:column;gap:10px}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb-h{display:flex;align-items:center;gap:8px;font:800 1.05rem/1.3 var(--f-ui)}
.fb.ok .fb-h{color:var(--ok)}
.fb.bad .fb-h{color:var(--bad)}
.fb-h svg{width:22px;height:22px;flex:none}
.fb-h .xp{margin-left:auto;font:700 .8rem/1 var(--f-ui);opacity:.85}
.fb-ans{font-size:.98rem}
.rv{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.rv-jp{font:900 1.7rem/1.2 var(--f-jp)}
.rv-kana{font:700 1.1rem/1.3 var(--f-jp);color:var(--ink-2)}
.rv-vi{font:700 1rem/1.3 var(--f-ui)}
.fb p.why{font-size:.95rem}

/* summary */
.sum-top{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:112px;height:112px}
.ring .trk{fill:none;stroke:var(--line);stroke-width:9}
.ring .val{fill:none;stroke-width:9;stroke-linecap:round}
.ring.ok .val{stroke:var(--ok)}
.ring.bad .val{stroke:var(--bad)}
.ring .rt{font:900 22px var(--f-ui);fill:var(--ink)}
.sum-top h2{font:800 1.35rem/1.3 var(--f-ui)}
.sum-nums{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:.92rem;color:var(--ink-2)}
.sum-nums b{font-size:1.15rem;color:var(--ink);font-variant-numeric:tabular-nums}
.sum-nums .g b{color:var(--ok)}
.sum-nums .r b{color:var(--bad)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;background:var(--surface-2);border-radius:12px;border:1px solid var(--line)}

.hl.hg{background:linear-gradient(transparent 55%,var(--hl-g) 55%)}

text:'{私|わたし}は{去年|きょねん}から{東京|とうきょう}の{会社|かいしゃ}で{働|はたら}いています。[[v4|{給料|きゅうりょう}]]はあまり{高|たか}くないですが、{仕事|しごと}は{楽|たの}しいです。\n{先週|せんしゅう}、[[v2|{会議|かいぎ}]]の[[v3|{資料|しりょう}]]を{作|つく}ったとき、{数字|すうじ}を{間違|まちが}えて[[v7|{失敗|しっぱい}しました]]。\n[[v0|{上司|じょうし}]]に[[g0|{呼|よ}ばれて]]、「もっと{気|き}をつけてください」と[[g1|{注意|ちゅうい}されました]]。\nその{日|ひ}は{遅|おそ}くまで[[v5|{残業|ざんぎょう}]]をして、{帰|かえ}り{道|みち}で{雨|あめ}に[[g2|{降|ふ}られました]]。\n{次|つぎ}の{日|ひ}、[[v1|{同僚|どうりょう}]]の{山田|やまだ}さんに[[v8|{相談|そうだん}したら]]、「{私|わたし}も{前|まえ}に{同|おな}じ{失敗|しっぱい}をしたよ」と{笑|わら}って{言|い}いました。\n{来月|らいげつ}、{大阪|おおさか}で{新|あたら}しい{商品|しょうひん}の{発表会|はっぴょうかい}が[[g3|{開|ひら}かれます]]。\nその{商品|しょうひん}は{山田|やまだ}さんのチーム[[g3|によって{作|つく}られました]]。\n{私|わたし}も[[v6|{出張|しゅっちょう}]]で{行|い}くので、{今日|きょう}、{大阪|おおさか}の{支店|してん}に[[v9|{連絡|れんらく}しました]]。',
vi:'Tôi làm việc ở một công ty tại Tokyo từ năm ngoái. Lương không cao lắm nhưng công việc thì vui.\nTuần trước, khi làm tài liệu cho cuộc họp, tôi ghi sai số liệu và đã mắc lỗi.\nTôi bị cấp trên gọi lên và nhắc nhở: "Hãy cẩn thận hơn."\nHôm đó tôi làm thêm giờ đến khuya, và trên đường về còn bị mắc mưa.\nHôm sau, tôi xin ý kiến anh Yamada, đồng nghiệp của tôi, thì anh cười và nói: "Trước đây tôi cũng từng mắc lỗi y như vậy."\nTháng sau, buổi ra mắt sản phẩm mới sẽ được tổ chức ở Osaka.\nSản phẩm đó do nhóm của anh Yamada làm ra.\nTôi cũng sẽ đi công tác đến đó, nên hôm nay tôi đã liên lạc với chi nhánh Osaka.',
qs:[
{q:'{先週|せんしゅう}、「{私|わたし}」は どんな {失敗|しっぱい}を しましたか。',o:['{資料|しりょう}の {数字|すうじ}を {間違|まちが}えた','{会議|かいぎ}に {遅|おく}れた','{支店|してん}に {連絡|れんらく}しなかった','{上司|じょうし}の {資料|しりょう}を なくした'],qv:'Tuần trước, "tôi" đã mắc lỗi gì?',ov:['Ghi sai số liệu trong tài liệu','Đến họp muộn','Không liên lạc với chi nhánh','Làm mất tài liệu của cấp trên'],w:'Dòng 2: 会議の資料を作ったとき、数字を間違えて失敗しました (khi làm tài liệu cho cuộc họp đã ghi sai số liệu).'},

{q:'{来月|らいげつ}、{大阪|おおさか}で {何|なに}が ありますか。',o:['{新|あたら}しい {商品|しょうひん}の {発表会|はっぴょうかい}','{支店|してん}の {会議|かいぎ}','{山田|やまだ}さんの {送別会|そうべつかい}','{新|あたら}しい {社員|しゃいん}の {面接|めんせつ}'],qv:'Tháng sau ở Osaka có sự kiện gì?',ov:['Buổi ra mắt sản phẩm mới','Cuộc họp của chi nhánh','Tiệc chia tay anh Yamada','Buổi phỏng vấn nhân viên mới'],w:'Dòng 6: 来月、大阪で新しい商品の発表会が開かれます (buổi ra mắt sản phẩm mới sẽ được tổ chức).'}

text:'{来週|らいしゅう}、{会社|かいしゃ}で{新|あたら}しい{社員|しゃいん}の[[v3|{歓迎会|かんげいかい}]]があります。\n{今年|ことし}は{私|わたし}が{幹事|かんじ}なので、{課長|かちょう}に「[[v5|{会場|かいじょう}]]は{私|わたし}に[[g2|{決|き}めさせてください]]」と{言|い}いました。\n{課長|かちょう}は{笑|わら}って、{私|わたし}に{好|す}きな{店|みせ}を[[g1|{選|えら}ばせてくれました]]。\n{店|みせ}に{電話|でんわ}して、「{準備|じゅんび}のために、{一時間|いちじかん}{早|はや}く[[g3|{入|はい}らせていただけませんか]]」と{頼|たの}みました。\n{部屋|へや}は{花|はな}で[[v8|{飾|かざ}って]]、{新|あたら}しい{社員|しゃいん}の{入社|にゅうしゃ}を[[v7|{祝|いわ}います]]。\n{社長|しゃちょう}も[[v2|{招待|しょうたい}した]]ので、{全部|ぜんぶ}で{三十人|さんじゅうにん}ぐらい[[v4|{参加|さんか}する]]でしょう。\n{去年|きょねん}の{歓迎会|かんげいかい}では、{部長|ぶちょう}が{新人|しんじん}に{歌|うた}を[[g0|{歌|うた}わせたり]]、[[v9|{踊|おど}らせたり]]して、とても[[v6|{賑|にぎ}やか]]でした。\n{夏|なつ}には{会社|かいしゃ}のみんなで[[v0|{祭|まつ}り]]に{行|い}って、[[v1|{花火|はなび}]]を{見|み}る{予定|よてい}です。',
vi:'Tuần sau ở công ty có tiệc chào đón nhân viên mới.\nNăm nay tôi là người tổ chức, nên tôi đã nói với trưởng bộ phận: "Xin hãy để tôi quyết định địa điểm."\nTrưởng bộ phận cười và để tôi chọn quán mình thích.\nTôi gọi điện cho quán và nhờ: "Để chuẩn bị, cho chúng tôi vào sớm một tiếng được không ạ?"\nChúng tôi sẽ trang trí phòng bằng hoa và mừng các nhân viên mới vào công ty.\nTôi cũng đã mời giám đốc, nên chắc tổng cộng sẽ có khoảng ba mươi người tham gia.\nỞ tiệc chào đón năm ngoái, trưởng phòng bắt nhân viên mới hát rồi nhảy, không khí rất náo nhiệt.\nMùa hè, cả công ty dự định cùng đi lễ hội và xem pháo hoa.',
qs:[
{q:'「{私|わたし}」は {課長|かちょう}に {何|なに}を {頼|たの}みましたか。',o:['{会場|かいじょう}を {自分|じぶん}で {決|き}めること','{歓迎会|かんげいかい}を {休|やす}むこと','{社長|しゃちょう}を {招待|しょうたい}すること','{店|みせ}に {電話|でんわ}すること'],qv:'"Tôi" đã nhờ trưởng bộ phận điều gì?',ov:['Để mình tự quyết định địa điểm','Được vắng mặt ở buổi tiệc','Mời giám đốc','Gọi điện cho quán'],w:'Dòng 2: 課長に「会場は私に決めさせてください」と言いました (xin hãy để tôi quyết định địa điểm).'},
{q:'「{私|わたし}」は {店|みせ}に {何|なに}を お{願|ねが}いしましたか。',o:['{一時間|いちじかん} {早|はや}く {入|はい}ること','{部屋|へや}を {花|はな}で {飾|かざ}ること','{料金|りょうきん}を {安|やす}く すること','{花火|はなび}を {用意|ようい}すること'],qv:'"Tôi" đã nhờ quán điều gì?',ov:['Cho vào sớm một tiếng','Trang trí phòng bằng hoa','Giảm giá','Chuẩn bị pháo hoa'],w:'Dòng 4: 「準備のために、一時間早く入らせていただけませんか」と頼みました. Việc trang trí hoa là do chính nhóm người kể làm (dòng 5).'},
{q:'{去年|きょねん}の {歓迎会|かんげいかい}で、{部長|ぶちょう}は {何|なに}を しましたか。',o:['{新人|しんじん}に {歌|うた}を {歌|うた}わせた','{自分|じぶん}で {歌|うた}を {歌|うた}った','{新人|しんじん}に {花|はな}を あげた','{歓迎会|かんげいかい}に {来|こ}なかった'],qv:'Ở tiệc chào đón năm ngoái, trưởng phòng đã làm gì?',ov:['Bắt nhân viên mới hát','Tự mình hát','Tặng hoa cho nhân viên mới','Không đến dự tiệc'],w:'Dòng 7: 部長が新人に歌を歌わせたり、踊らせたりして (trưởng phòng bắt nhân viên mới hát, nhảy).'}
]}
});

title:'{携帯|けいたい}が{壊|こわ}れた！',
text:'{昨日|きのう}、{私|わたし}の{携帯|けいたい}が{急|きゅう}に[[v6|{壊|こわ}れて]][[g2|しまいました]]。\n[[v2|{充電|じゅうでん}]]しても、[[v3|{画面|がめん}]]に{何|なに}も{出|で}ません。\nでも、{大切|たいせつ}な{写真|しゃしん}はパソコンに[[v8|{保存|ほぞん}]]して[[g1|おいた]]ので、{安心|あんしん}しました。\nパソコンで{近|ちか}くの{修理|しゅうり}の{店|みせ}を[[v9|{検索|けんさく}]]して、{行|い}って[[g3|みました]]。\n{店|みせ}には{古|ふる}い[[v4|{機械|きかい}]]がたくさん{並|なら}べて[[g0|あって]]、{少|すこ}しびっくりしました。\n{店|みせ}の{人|ひと}は「[[v5|{故障|こしょう}]]ですね。{三日|みっか}で[[v7|{直|なお}せます]]よ」と{言|い}いました。\n{家|いえ}に{帰|かえ}ると、{母|はは}が「[[v0|{留守|るす}]]の{間|あいだ}に、{友達|ともだち}から{家|いえ}の{電話|でんわ}に[[v1|{伝言|でんごん}]]があったよ」と{教|おし}えてくれました。\n{携帯|けいたい}がないと{不便|ふべん}ですが、{少|すこ}しずつ{慣|な}れて[[g4|きました]]。',
vi:'Hôm qua điện thoại của tôi bỗng nhiên bị hỏng mất.\nDù đã sạc pin, màn hình vẫn không hiện gì cả.\nNhưng vì những bức ảnh quan trọng tôi đã lưu sẵn vào máy tính nên tôi yên tâm.\nTôi tìm tiệm sửa chữa gần nhà trên máy tính rồi thử đến đó.\nTrong tiệm có bày sẵn rất nhiều máy móc cũ, tôi hơi ngạc nhiên.\nNgười ở tiệm nói: "Bị hỏng hóc rồi. Ba ngày là sửa được."\nVề đến nhà, mẹ bảo tôi: "Lúc con vắng nhà, bạn con đã để lại lời nhắn qua điện thoại bàn đấy."\nKhông có điện thoại di động thì bất tiện, nhưng tôi đã dần quen.',
qs:[
{q:'「{私|わたし}」は どうして {安心|あんしん}しましたか。',o:['{写真|しゃしん}を パソコンに {保存|ほぞん}して いたから','{携帯|けいたい}の {充電|じゅうでん}が できたから','{修理|しゅうり}が {無料|むりょう}だったから','{母|はは}が {携帯|けいたい}を {貸|か}して くれたから'],qv:'Vì sao "tôi" thấy yên tâm?',ov:['Vì đã lưu ảnh vào máy tính','Vì sạc được pin điện thoại','Vì sửa chữa miễn phí','Vì mẹ cho mượn điện thoại'],w:'Dòng 3: 大切な写真はパソコンに保存しておいたので、安心しました.'},
{q:'{店|みせ}の {人|ひと}は {何|なん}と {言|い}いましたか。',o:['{三日|みっか}で {直|なお}せる','もう {直|なお}せない','{新|あたら}しい {携帯|けいたい}を {買|か}った ほうが いい','{充電|じゅうでん}すれば {使|つか}える'],qv:'Người ở tiệm đã nói gì?',ov:['Ba ngày là sửa được','Không sửa được nữa','Nên mua điện thoại mới','Sạc pin là dùng được'],w:'Dòng 6: 「故障ですね。三日で直せますよ」.'},
{q:'{母|はは}は 「{私|わたし}」に {何|なに}を {教|おし}えましたか。',o:['{友達|ともだち}から {伝言|でんごん}が あった こと','{友達|ともだち}が {家|いえ}に {来|き}た こと','{携帯|けいたい}を {直|なお}した こと','パソコンが {壊|こわ}れた こと'],qv:'Mẹ đã cho "tôi" biết điều gì?',ov:['Bạn đã để lại lời nhắn','Bạn đã đến nhà','Mẹ đã sửa điện thoại','Máy tính bị hỏng'],w:'Dòng 7: 留守の間に、友達から家の電話に伝言があったよ (bạn để lại lời nhắn qua điện thoại bàn).'}

vocab:[

['申し込む','もうしこむ','đăng ký','','申す (thưa) + 込む (vào): "thưa vào" danh sách, tức là đăng ký. Đọc "mô-shi-kô-mu" ≈ "mở sổ cô mua": mở sổ ra ghi tên đăng ký.','日本語の授業に申し込みました。','Tôi đã đăng ký lớp tiếng Nhật.'],
['締め切り','しめきり','hạn chót','','締める (siết lại) + 切る (cắt): tới hạn thì siết lại và cắt, không nhận thêm nữa. Đọc "shi-mê-ki-ri" ≈ "sẽ mê kỳ rì": mải mê kỳ kèo là trễ hạn ngay.','レポートの締め切りは金曜日です。','Hạn nộp báo cáo là thứ Sáu.'],
['窓口','まどぐち','quầy giao dịch','song khẩu','窓 (song = cửa sổ) + 口 (khẩu = miệng, lối vào): ô cửa nhỏ để giao dịch. Đọc "ma-đô-gu-chi": ô cửa sổ (まど) nơi bạn nói chuyện với nhân viên.','切手は二番の窓口で買えます。','Tem có thể mua ở quầy số 2.'],
['手続き','てつづき','thủ tục','thủ tục','Giống y tiếng Việt: THỦ TỤC → てつづき. 手 (tay) + 続き (nối tiếp): từng bước tay làm nối tiếp nhau.','市役所で引っ越しの手続きをしました。','Tôi đã làm thủ tục chuyển nhà ở tòa thị chính.'],

['無料','むりょう','miễn phí','vô liệu','Hán Việt VÔ LIỆU: không (vô) mất phí (liệu, như 料金). Ngược lại là 有料 (có phí). Đọc "mu-ryô" ≈ "mua rẻ": còn hơn mua rẻ, vì chẳng mất đồng nào.','このホテルはWi-Fiが無料です。','Khách sạn này Wi-Fi miễn phí.']

read:{
title:'{郵便局|ゆうびんきょく}で',
text:'{私|わたし}は{来年|らいねん}の{留学|りゅうがく}プログラムに[[v4|{申|もう}し{込|こ}む]]ことにしました。{授業料|じゅぎょうりょう}が[[v9|{無料|むりょう}]]だからです。\n[[v5|{締|し}め{切|き}り]]は{明後日|あさって}なので、{今日|きょう}、{郵便局|ゆうびんきょく}の[[v6|{窓口|まどぐち}]]へ{行|い}きました。\n「[[v1|{速達|そくたつ}]]でお{願|ねが}いします」と{言|い}うと、{係|かかり}の{人|ひと}は「[[g3|{少々|しょうしょう}お{待|ま}ちください]]」と{言|い}いました。\nそれから、「こちらに{住所|じゅうしょ}を[[v8|{記入|きにゅう}]]して[[g3|いただけませんか]]」と{言|い}われました。\n{係|かかり}の{人|ひと}は「[[v0|{封筒|ふうとう}]]を[[g2|お{預|あず}かりします]]。{明日|あした}の{午前中|ごぜんちゅう}に[[v2|{届|とど}きます]]よ」と{言|い}いました。\nそのあと{大学|だいがく}の{先生|せんせい}に{電話|でんわ}すると、{先生|せんせい}は「{書類|しょるい}を[[v3|{受|う}け{取|と}ったら]]、すぐ{連絡|れんらく}します」と[[g0|おっしゃいました]]。\n{私|わたし}は「{来週|らいしゅう}、{残|のこ}りの[[v7|{手続|てつづ}き]]をしに{研究室|けんきゅうしつ}へ[[g1|{参|まい}ります]]」と{答|こた}えました。',
vi:'Tôi đã quyết định đăng ký chương trình du học năm sau. Vì học phí được miễn.\nHạn chót là ngày kia, nên hôm nay tôi đã đến quầy giao dịch của bưu điện.\nKhi tôi nói "Cho tôi gửi chuyển phát nhanh", nhân viên phụ trách nói "Xin vui lòng đợi một chút".\nSau đó, tôi được nhờ: "Anh có thể điền địa chỉ vào đây được không ạ?"\nNhân viên nói: "Tôi xin nhận giữ phong bì. Sáng mai sẽ đến nơi."\nSau đó tôi gọi điện cho thầy ở trường đại học, thầy nói: "Nhận được hồ sơ là tôi sẽ liên lạc ngay."\nTôi trả lời: "Tuần sau em sẽ đến phòng nghiên cứu để làm nốt các thủ tục còn lại ạ."',

read:{

text:'{夏休|なつやす}みに、{家族|かぞく}と{小|ちい}さな[[v5|{島|しま}]]へキャンプに{行|い}きました。\n{島|しま}は[[v0|{自然|しぜん}]]が[[g3|{豊|ゆた}かだし]]、{人|ひと}も{少|すく}ないし、とても{静|しず}かでした。\n{昼|ひる}は[[v3|{太陽|たいよう}]]の{下|した}で{泳|およ}いで、{夜|よる}は{星|ほし}を[[g2|{見|み}ながら]]{話|はな}しました。\n[[v4|{森|もり}]]には{珍|めずら}しい[[v6|{植物|しょくぶつ}]]がたくさんありましたが、{道|みち}は{少|すこ}し[[g1|{歩|ある}きにくかった]]です。\n[[v7|{虫|むし}]]が{多|おお}くて、{妹|いもうと}は{虫|むし}に「こっちに[[g0|{来|く}るな]]！」と{言|い}っていました。\nキャンプ{場|じょう}には「[[v9|{火事|かじ}]]に{注意|ちゅうい}！」という{看板|かんばん}がありました。\n{父|ちち}は「[[v8|{地震|じしん}]]が{来|き}たら、すぐ{高|たか}い{所|ところ}へ{逃|に}げなさい」と{教|おし}えてくれました。\nこの{旅行|りょこう}で、[[v2|{地球|ちきゅう}]]の[[v1|{環境|かんきょう}]]を{大切|たいせつ}にしたいと{思|おも}いました。',

n:15, week:18, title:'Cặp đồng nghĩa, trái nghĩa',
vocab:[
['増える','ふえる','tăng lên','tăng','増 = TĂNG (tăng trưởng). Đọc "fu-ê-ru" ≈ "phù": số lượng phình phù lên. Học luôn cặp: ふえる (tăng) ↔ へる (giảm).','日本に住む外国人が増えています。','Số người nước ngoài sống ở Nhật đang tăng lên.'],
['減る','へる','giảm đi','giảm','減 = GIẢM. Đọc "hê-ru" ≈ "hết rồi": giảm mãi thì hết. Cặp trái nghĩa với 増える; おなかが減る = đói bụng.','最近、体重が減りました。','Dạo này cân nặng của tôi đã giảm.'],
['賛成','さんせい','tán thành, đồng ý','tán thành','Giống y tiếng Việt: TÁN THÀNH → さんせい. Mẫu: 〜に賛成する. Đứng cạnh ngay cặp trái nghĩa của nó là 反対 (phản đối).','私はその意見に賛成です。','Tôi tán thành ý kiến đó.'],
['反対','はんたい','phản đối; ngược lại','phản đối','Giống y tiếng Việt: PHẢN ĐỐI → はんたい. Còn có nghĩa "ngược lại": 反対側 (phía đối diện). Cặp: 賛成 (tán thành) ↔ 反対 (phản đối).','父は私の留学に反対しました。','Bố đã phản đối việc tôi đi du học.'],
['得意','とくい','giỏi, sở trường','đắc ý','Hán Việt ĐẮC Ý: làm việc mình giỏi thì thấy đắc ý. 〜が得意 = giỏi và tự tin về ... Cặp trái nghĩa: 苦手.','妹は料理が得意です。','Em gái tôi giỏi nấu ăn.'],
['苦手','にがて','kém, không giỏi; ngại','khổ thủ','Hán Việt KHỔ THỦ: đến tay (thủ) là thấy khổ. 苦 đọc にが như 苦い (đắng): việc gì "đắng" với mình là 苦手. Cặp: 得意 (giỏi) ↔ 苦手 (kém).','私は数学が苦手です。','Tôi kém môn toán.'],
['固い','かたい','cứng','cố','Hán Việt CỐ như kiên cố, cố định: chắc và cứng. Đọc "ka-tai" ≈ "cà tai": bánh cứng đến mức nhai cà cả tai. Cặp trái nghĩa: 柔らかい (mềm).','このパンは固くて、食べにくいです。','Bánh mì này cứng nên khó ăn.'],
['柔らかい','やわらかい','mềm','nhu','Hán Việt NHU như 柔道 (nhu đạo, judo): mềm dẻo. Đọc "ya-wa-ra-kai", âm kéo dài nghe mềm mại. Cặp: 固い (cứng) ↔ 柔らかい (mềm).','この肉は柔らかくて、おいしいです。','Thịt này mềm và ngon.'],
['もうすぐ','もうすぐ','sắp, chẳng mấy chốc','','もう (đã) + すぐ (ngay): "sắp ngay rồi". Dùng trong lời nói hằng ngày. Bạn đồng nghĩa trang trọng hơn của nó là まもなく.','もうすぐ夏休みです。','Sắp đến kỳ nghỉ hè rồi.'],
['まもなく','まもなく','sắp, ngay sau đây (trang trọng)','','Viết kanji là 間もなく: "không (な) còn khoảng (間) nào" = sắp tới nơi. Nghe hằng ngày ở ga tàu. Đồng nghĩa với もうすぐ nhưng trang trọng hơn.','まもなく電車が来ます。','Tàu điện sắp đến.']
],
gram:[
{ti:'〜と / 〜ば / 〜たら / 〜なら',fo:'と: thể từ điển + と  |  ば: 行けば, 安ければ  |  たら: thể た + ら  |  なら: thể thông thường / danh từ + なら',me:'と: quy luật, kết quả tất yếu  |  ば: điều kiện chung  |  たら: "khi / nếu ... thì", vế sau tự do  |  なら: "nếu là chuyện đó thì ...", tiếp lời người khác',
tip:'Nhớ ba mẹo: (1) Vế sau là lời nhờ, rủ, khuyên → không dùng と. (2) Muốn an toàn thì chọn たら, vế sau gì cũng được. (3) Việc ở vế sau phải làm TRƯỚC vế trước (khuyên trước khi đi) → chỉ dùng なら.',
ex:[['春になると、暖かくなります。','Cứ đến mùa xuân là trời ấm lên.'],['京都へ行くなら、秋がいいです。','Nếu đi Kyoto thì mùa thu là đẹp.']],
wa:'と không đi với lời nhờ, rủ, ý chí: 夏になると、旅行しましょう là sai; phải nói 夏になったら、旅行しましょう.',
qs:[
{p:'A「来週、京都へ行きます。」B「京都へ行く＿＿、ホテルを早く予約したほうがいいですよ。」',h:'Đặt phòng phải làm trước khi đi',o:['なら','と','ば','のに'],w:'Tiếp lời người khác và lời khuyên làm trước chuyến đi: dùng なら. と không đi với lời khuyên; 行くば sai dạng.',s:'京都へ行くなら、ホテルを早く予約したほうがいいですよ。',vi:'Nếu đi Kyoto thì nên đặt khách sạn sớm đấy.'},
{p:'Chọn câu đúng: "Đến ga rồi thì gọi điện cho tôi nhé."',o:['駅に着いたら、電話してください。','駅に着くと、電話してください。','駅に着くなら、電話してください。','駅に着いたば、電話してください。'],w:'Vế sau là lời nhờ, việc gọi xảy ra SAU khi đến: dùng たら. と không đi với lời nhờ; 着くなら nghĩa là gọi trước khi đến.',s:'駅に着いたら、電話してください。',vi:'Đến ga rồi thì gọi điện cho tôi nhé.'},
{p:'Câu nào dùng 〜と SAI?',o:['夏休みになると、一緒に旅行しましょう。','春になると、暖かくなります。','右に曲がると、駅があります。','お酒を飲むと、顔が赤くなります。'],w:'と diễn tả quy luật, kết quả tất yếu; không đi với lời rủ 〜ましょう. Phải nói 夏休みになったら.',s:'夏休みになったら、一緒に旅行しましょう。',vi:'Khi nghỉ hè đến thì cùng đi du lịch nhé.'}
]},
{ti:'〜ために / 〜ように',fo:'ために: động từ ý chí thể từ điển / Danh từ + の + ために  |  ように: thể khả năng, thể ない, động từ vô ý chí + ように',me:'Đều là "để ...". ために: mục đích là một hành động có chủ ý. ように: mục đích là một trạng thái mong đạt tới',
tip:'Hỏi: vế trước có phải việc mình chủ động làm được ngay không? Có (留学する, 買う) → ために. Không, chỉ là trạng thái mong muốn (話せる, 見える, 忘れない, 治る) → ように.',
ex:[['日本へ行くために、お金をためています。','Tôi đang để dành tiền để đi Nhật.'],['忘れないように、メモします。','Tôi ghi chú lại để không quên.']],
wa:'Thể khả năng (話せる, 読める) gần như luôn đi với ように, không đi với ために.',
qs:[
{p:'留学する＿＿、お金をためています。',o:['ために','ように','のに','ことに'],w:'留学する là hành động có chủ ý của chính mình: dùng ために.',vi:'Tôi đang để dành tiền để đi du học.'},
{p:'日本語が上手に話せる＿＿、毎日練習しています。',h:'話せる là thể khả năng',o:['ように','ために','のに','ことに'],w:'Thể khả năng 話せる là trạng thái mong đạt tới: dùng ように.',vi:'Tôi luyện tập mỗi ngày để có thể nói giỏi tiếng Nhật.'},
{p:'「風邪をひかないように、コートを着ました。」nghĩa là gì?',o:['Tôi mặc áo khoác để không bị cảm.','Tôi mặc áo khoác vì đã bị cảm.','Tôi bị cảm dù đã mặc áo khoác.','Tôi mặc áo khoác giống như người bị cảm.'],w:'Thể ない + ように = để (tránh) không ... : mục đích là trạng thái không bị cảm.',s:'風邪をひかないように、コートを着ました。',vi:'Tôi đã mặc áo khoác để không bị cảm.'}
]},
{ti:'〜ている / 〜てある',fo:'Tự động từ + ている (窓が開いている)  |  Tha động từ + てある (窓が開けてある)',me:'ている: trạng thái đang có, không quan tâm ai làm  |  てある: có người đã chủ ý làm sẵn',
tip:'Nhìn động từ: tự động từ (開く, 閉まる, つく) + ている = chỉ tả cảnh. Tha động từ (開ける, 閉める, つける) + てある = có bàn tay ai đó làm sẵn, thường vì một mục đích. Cả hai đều dùng が: 窓が開いている / 窓が開けてある.',
ex:[['窓が開いています。','Cửa sổ đang mở.'],['窓が開けてあります。','Cửa sổ đã được (ai đó) mở sẵn.']],
wa:'Tha động từ + ている với が là sai: 窓が開けています. Muốn nói người đang làm thì dùng を: 窓を開けています.',
qs:[
{p:'テーブルの上に花が飾って＿＿。',o:['あります','います','おきます','しまいます'],w:'飾る là tha động từ, chủ thể là 花 + が: dùng てある (có người trang trí sẵn).',vi:'Trên bàn có hoa được cắm sẵn để trang trí.'},
{p:'Chọn câu đúng ngữ pháp.',o:['ドアが閉まっています。','ドアが閉まってあります。','ドアが閉めています。','ドアを閉まっています。'],w:'閉まる là tự động từ → 閉まっている. Tự động từ không đi với てある; 閉める với が không dùng ている.',s:'ドアが閉まっています。',vi:'Cửa đang đóng.'},
{p:'「エアコンがつけてあります。」nhấn mạnh điều gì?',o:['Có người đã chủ ý bật điều hòa sẵn','Điều hòa tự bật lên','Có người đang bật điều hòa ngay lúc này','Điều hòa đã bị hỏng'],w:'Tha động từ つける + てある = ai đó đã chủ ý làm sẵn và kết quả còn lại.',s:'エアコンがつけてあります。',vi:'Điều hòa đã được bật sẵn.'}
]},
{ti:'〜そうだ (dáng vẻ) / 〜そうだ (nghe nói)',fo:'Dáng vẻ: động từ bỏ ます / tính từ bỏ い, bỏ な + そうだ (いい → よさそう)  |  Nghe nói: thể thông thường + そうだ',me:'Dáng vẻ: "trông có vẻ / sắp ..." (chính mắt thấy)  |  Nghe nói: "nghe nói là ..." (truyền đạt thông tin)',
tip:'Nhìn chữ đứng trước そう: thân động từ, tính từ đã bị cắt (降り, おいし) = mắt thấy. Thể đầy đủ (降る, おいしい) = tai nghe. Câu nghe nói hay đi kèm 〜によると, 〜の話では.',
ex:[['雨が降りそうです。','Trời trông sắp mưa.'],['雨が降るそうです。','Nghe nói trời sẽ mưa.']],
wa:'Danh từ chỉ dùng được với そうだ nghe nói (学生だそうです), không dùng với そうだ dáng vẻ.',
qs:[
{p:'(Nhìn bầu trời đen kịt) 今にも雨が＿＿そうです。',o:['降り','降る','降った','降って'],w:'Tự mắt thấy, sắp xảy ra: thân động từ bỏ ます + そう = 降りそう. 降るそう là "nghe nói".',s:'今にも雨が降りそうです。',vi:'Trời như sắp mưa đến nơi.'},
{p:'天気予報によると、明日は＿＿そうです。',h:'Thông tin từ dự báo thời tiết',o:['寒い','寒','寒く','寒くて'],w:'Nghe từ dự báo (によると): thể thông thường + そうだ = 寒いそうです. 寒そう là "trông có vẻ lạnh".',vi:'Theo dự báo thời tiết, nghe nói ngày mai trời lạnh.'},
{p:'「田中さんの話では、あの店のケーキはおいしいそうです。」nghĩa là gì?',o:['Theo lời anh Tanaka, nghe nói bánh ở tiệm đó ngon.','Nhìn bánh ở tiệm đó có vẻ ngon.','Anh Tanaka chắc chắn bánh ở tiệm đó ngon.','Bánh ở tiệm đó không ngon như anh Tanaka nói.'],w:'おいしい (thể đầy đủ) + そうです = nghe nói; 話では cho biết nguồn tin.',s:'田中さんの話では、あの店のケーキはおいしいそうです。',vi:'Theo lời anh Tanaka, nghe nói bánh ở tiệm đó ngon.'}
]}
],

title:'{料理|りょうり}{教室|きょうしつ}',
text:'{私|わたし}は{料理|りょうり}が[[v5|{苦手|にがて}]]ですが、{姉|あね}はとても[[v4|{得意|とくい}]]です。\n{姉|あね}の{話|はなし}では、{最近|さいきん}、{料理|りょうり}{教室|きょうしつ}に{通|かよ}う{男|おとこ}の{人|ひと}が[[v0|{増|ふ}えている]][[g3|そうです]]。\n{私|わたし}が「{行|い}ってみたい」と{言|い}うと、{姉|あね}は「{行|い}く[[g0|なら]]、{土曜日|どようび}のクラスがいいよ」と[[v2|{賛成|さんせい}]]してくれました。\n{母|はは}は「お{金|かね}がかかる」と{少|すこ}し[[v3|{反対|はんたい}]]しましたが、{外食|がいしょく}が[[v1|{減|へ}る]]から{大丈夫|だいじょうぶ}だと{思|おも}います。\n{教室|きょうしつ}に{入|はい}ると、テーブルの{上|うえ}に{材料|ざいりょう}が[[g2|{並|なら}べてありました]]。\n{先生|せんせい}は「お{肉|にく}が[[v7|{柔|やわ}らかく]]なる[[g1|ように]]、ゆっくり{煮|に}てください。[[v6|{固|かた}い]]とおいしくないですよ」と{言|い}いました。\n[[v8|もうすぐ]]できます。{鍋|なべ}のカレーはとても[[g3|おいしそう]]です。\n{先生|せんせい}が「[[v9|まもなく]]{食|た}べる{時間|じかん}ですよ」と{言|い}って、みんな{笑|わら}いました。',
vi:'Tôi kém nấu ăn, nhưng chị gái tôi thì rất giỏi.\nTheo lời chị, nghe nói dạo này số đàn ông đi học lớp nấu ăn đang tăng lên.\nKhi tôi nói "Em muốn đi thử", chị tán thành: "Nếu đi thì lớp thứ Bảy là được đấy."\nMẹ hơi phản đối vì "tốn tiền", nhưng tôi nghĩ không sao vì số lần ăn ngoài sẽ giảm.\nBước vào lớp, trên bàn đã có nguyên liệu được bày sẵn.\nThầy nói: "Hãy hầm thật chậm để thịt mềm ra. Thịt mà cứng thì không ngon đâu."\nSắp xong rồi. Món cà ri trong nồi trông rất ngon.\nThầy nói "Sắp đến giờ ăn rồi đấy", và mọi người cùng cười.',
qs:[
{q:'お{姉|ねえ}さんの {話|はなし}では、{最近|さいきん} {何|なに}が {増|ふ}えていますか。',o:['{料理|りょうり}{教室|きょうしつ}に {通|かよ}う {男|おとこ}の {人|ひと}','{料理|りょうり}{教室|きょうしつ}の {数|かず}','{外食|がいしょく}を する {人|ひと}','{料理|りょうり}が {得意|とくい}な {女|おんな}の {人|ひと}'],qv:'Theo lời chị gái, dạo này cái gì đang tăng lên?',ov:['Đàn ông đi học lớp nấu ăn','Số lớp dạy nấu ăn','Người đi ăn ngoài','Phụ nữ giỏi nấu ăn'],w:'Câu 2: 料理教室に通う男の人が増えているそうです.'},
{q:'お{母|かあ}さんは どうして {少|すこ}し {反対|はんたい}しましたか。',o:['お{金|かね}が かかるから','{料理|りょうり}が {苦手|にがて}だから','{土曜日|どようび}は {忙|いそが}しいから','{外食|がいしょく}が {好|す}きだから'],qv:'Vì sao mẹ hơi phản đối?',ov:['Vì tốn tiền','Vì nấu ăn kém','Vì thứ Bảy bận','Vì thích ăn ngoài'],w:'Câu 4: 母は「お金がかかる」と少し反対しました.'},
{q:'{先生|せんせい}は {何|なに}と {言|い}いましたか。',o:['{肉|にく}が {柔|やわ}らかく なるように ゆっくり {煮|に}る','{肉|にく}が {固|かた}く なるように {早|はや}く {煮|に}る','{柔|やわ}らかい {肉|にく}を {店|みせ}で {買|か}う','カレーに {肉|にく}を {入|い}れない'],qv:'Thầy giáo đã nói gì?',ov:['Hầm chậm để thịt mềm ra','Nấu nhanh để thịt cứng lại','Mua thịt mềm ở cửa hàng','Không cho thịt vào cà ri'],w:'Câu 6: お肉が柔らかくなるように、ゆっくり煮てください.'}
]}

n:16, week:19, title:'Động từ, phó từ và liên từ',
vocab:[
['続ける','つづける','tiếp tục (làm)','tục','Hán Việt TỤC như liên tục, tiếp tục. Gắn sau thân động từ = cứ làm mãi: 読み続ける (đọc mãi). Tự động từ đi cặp là 続く (tiếp diễn).','毎日、日本語の勉強を続けています。','Tôi vẫn tiếp tục học tiếng Nhật mỗi ngày.'],
['慣れる','なれる','quen với','quán','Hán Việt QUÁN như trong 習慣 (tập quán): làm mãi thành quen. Mẫu: 〜に慣れる. Đọc "na-rê-ru" ≈ "nài rồi": nài nỉ mãi rồi cũng quen.','日本の生活にもう慣れました。','Tôi đã quen với cuộc sống ở Nhật rồi.'],
['比べる','くらべる','so sánh','tỉ','Hán Việt TỈ như tỉ lệ, tỉ số: đặt hai thứ cạnh nhau để so. Mẫu: AとBを比べる, 〜に比べて (so với ...).','去年と比べて、日本語が上手になりました。','So với năm ngoái, tiếng Nhật của tôi đã giỏi hơn.'],
['誘う','さそう','mời, rủ','dụ','Hán Việt DỤ như dụ dỗ, rủ rê: rủ ai đó cùng làm. Đọc "sa-sô" ≈ "xa xôi": nhà bạn xa xôi mấy cũng rủ đi chơi.','友達を映画に誘いました。','Tôi đã rủ bạn đi xem phim.'],

['必ず','かならず','nhất định, chắc chắn','tất','Hán Việt TẤT như tất yếu, tất nhiên. Dùng cho việc chắc chắn làm hoặc xảy ra: 必ず来てください. Khác きっと (phỏng đoán chắc là).','明日は必ず来てください。','Ngày mai nhất định hãy đến nhé.'],

['急に','きゅうに','đột ngột, bỗng nhiên','cấp','Hán Việt CẤP như khẩn cấp, cấp tốc: việc xảy ra gấp, không báo trước. Đồng nghĩa trang trọng hơn: 突然 (đột nhiên).','急に雨が降ってきました。','Trời bỗng nhiên đổ mưa.'],
['ところが','ところが','thế nhưng (ngoài dự đoán)','','Liên từ "tưởng thế, ai ngờ ...": kết quả trái với điều mong đợi. Khác しかし: ところが dùng để kể chuyện đã xảy ra, không đi với lời nhờ hay ý chí.','晴れると思いました。ところが、午後から雨が降りました。','Tôi tưởng trời sẽ nắng. Thế nhưng từ chiều trời lại mưa.']

read:{

text:'{日本|にほん}に{来|き}た[[g4|ばかり]]のころは、{国|くに}の{生活|せいかつ}と[[v2|{比|くら}べて]]{何|なに}もかも{違|ちが}って、なかなか[[v1|{慣|な}れ]]ませんでした。\n{友達|ともだち}に{遊|あそ}びに[[v3|{誘|さそ}われて]]も、{恥|は}ずかしくていつも[[v4|{断|ことわ}って]]いました。\n[[v9|ところが]]、ある{日|ひ}、{先生|せんせい}が[[v8|{急|きゅう}に]]{私|わたし}にみんなの{前|まえ}で{作文|さくぶん}を[[g3|{読|よ}ませました]]。\n{読|よ}み{終|お}わると、みんなが「すごい！」と[[v5|{褒|ほ}めて]]くれて、とてもうれしかったです。\nそれから{毎日|まいにち}{勉強|べんきょう}を[[v0|{続|つづ}けて]]、{今|いま}、[[v7|やっと]]{最後|さいご}の{課|か}が{終|お}わった[[g4|ところです]]。\n{先輩|せんぱい}の{話|はなし}では、{今年|ことし}の{試験|しけん}は{少|すこ}し{難|むずか}しい[[g0|らしい]]です。\nでも、こんなに{頑張|がんば}ったのだから、{合格|ごうかく}できる[[g1|はずです]]。\n{合格|ごうかく}したら、{日本|にほん}で{働|はたら}く[[g2|つもりです]]。これからも[[v6|{必|かなら}ず]]{勉強|べんきょう}を{続|つづ}けます！',

const RM={};
(function(){
  const add=(c,v)=>{['a','i','u','e','o'].forEach((x,i)=>{RM[c+x]=v[i];});};
  add('','あいうえお');add('k','かきくけこ');add('s','さしすせそ');add('t','たちつてと');add('n','なにぬねの');
  add('h','はひふへほ');add('m','まみむめも');add('r','らりるれろ');add('g','がぎぐげご');add('z','ざじずぜぞ');
  add('d','だぢづでど');add('b','ばびぶべぼ');add('p','ぱぴぷぺぽ');
  Object.assign(RM,{ya:'や',yu:'ゆ',yo:'よ',wa:'わ',wo:'を',shi:'し',chi:'ち',tsu:'つ',fu:'ふ',ji:'じ',
    sha:'しゃ',shu:'しゅ',sho:'しょ',cha:'ちゃ',chu:'ちゅ',cho:'ちょ',ja:'じゃ',ju:'じゅ',jo:'じょ',
    xtu:'っ',ltu:'っ',xya:'ゃ',xyu:'ゅ',xyo:'ょ'});
  ['k','g','n','h','m','r','b','p'].forEach(c=>{
    [['a','ゃ'],['u','ゅ'],['o','ょ']].forEach(p=>{RM[c+'y'+p[0]]=RM[c+'i']+p[1];});

function toKana(s,final){
  s=String(s).toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
  let out='',i=0;
  while(i<s.length){
    const c=s[i];
    if(!/[a-z'\-]/.test(c)){out+=c;i++;continue;}
    if(c==='-'){out+='ー';i++;continue;}
    if(i+1<s.length&&c===s[i+1]&&/[bcdfghjklmpqrstvwxyz]/.test(c)){out+='っ';i++;continue;}
    if(c==='n'){
      const nx=s[i+1];
      if(nx==="'"){out+='ん';i+=2;continue;}
      if(nx==='n'&&i+2>=s.length){out+='ん';i+=2;continue;}
      if(nx===undefined){out+=final?'ん':'n';i++;continue;}
      if(!/[aiueoy]/.test(nx)){out+='ん';i++;continue;}
    }
    let m=null;
    for(const L of [3,2,1]){const k=s.substr(i,L);if(RM[k]){m=[k,RM[k]];break;}}
    if(m){out+=m[1];i+=m[0].length;}else{out+=c;i++;}
  }
  return out;
}
const normK=s=>toKana(s,true).replace(/\s+/g,'');

function romaji(k){
  k=String(k||'').replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
  let o='';
  for(let i=0;i<k.length;i++){
    const c=k[i],n=k[i+1];
    if(c==='っ'){const nx=romaji(k.slice(i+1,i+3))[0];if(nx&&/[a-z]/.test(nx)){o+=nx==='c'?'t':nx;}continue;}
    if(c==='ー'){const v=o.match(/[aeiou]$/);o+=v?v[0]:'';continue;}
    if(n&&'ゃゅょ'.includes(n)&&KR[c]){const base=KR[c];const y={'ゃ':'a','ゅ':'u','ょ':'o'}[n];
      if(/^(shi|chi|ji)$/.test(base))o+=base.slice(0,-1)+y;else o+=base.slice(0,-1)+'y'+y;i++;continue;}
    if(c==='ん'){o+=(n&&/[あいうえおやゆよ]/.test(n))?"n'":'n';continue;}
    o+=KR[c]!==undefined?KR[c]:c;
  }
  return o;
}

const LSK='dojo-n4-progress-v1';
const fresh=()=>({v:1,t:0,xp:0,days:[],lv:{},it:{},cp:{}});
function loadLocal(){try{const j=localStorage.getItem(LSK);if(j){const o=JSON.parse(j);if(o&&o.v===1)return Object.assign(fresh(),o);}}catch(e){}return fresh();}
let S=loadLocal();
const CLOUD={ref:null,ok:false,busy:false,dirty:false,timer:0};
function save(){
  S.t=now();
  try{localStorage.setItem(LSK,JSON.stringify(S));}catch(e){}
  if(CLOUD.ref){CLOUD.dirty=true;clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(cloudFlush,1500);}
}
async function cloudFlush(){
  if(!CLOUD.ref||CLOUD.busy||!CLOUD.dirty)return;
  CLOUD.busy=true;CLOUD.dirty=false;
  try{await CLOUD.ref.set({s:JSON.stringify(S),t:S.t});CLOUD.ok=true;}catch(e){CLOUD.ok=false;}
  CLOUD.busy=false;
  if(CLOUD.dirty){clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(cloudFlush,1500);}
}
async function cloudInit(){
  try{
    if(!window.claude||!window.claude.use)return;
    const db=await window.claude.use('db'),user=await window.claude.use('user');
    if(!db||!user)return;
    const id=await user.id();
    if(!id)return;
    const ref=db.doc('data/users/'+id+'/progress');
    const snap=await ref.get();
    CLOUD.ref=ref;
    if(snap.exists){
      const d=snap.data();let r=null;
      try{r=JSON.parse(d.s);}catch(e){}
      if(r&&r.v===1&&(r.t||0)>(S.t||0)){
        S=Object.assign(fresh(),r);
        try{localStorage.setItem(LSK,JSON.stringify(S));}catch(e){}
        CLOUD.ok=true;rerenderIdle();return;
      }
    }
    CLOUD.ok=true;
    if((S.t||0)>0){CLOUD.dirty=true;cloudFlush();}
    rerenderIdle();
  }catch(e){}
}

function levelStatus(n){
  if(S.lv[n]&&S.lv[n].done)return 'done';
  if(n===1)return 'open';
  const p=n-1;
  if(!(S.lv[p]&&S.lv[p].done))return 'locked';
  if(p%2===0&&!(S.cp[p]&&S.cp[p].pass))return 'locked';
  return 'open';
}
function cpStatus(k){
  if(S.cp[k]&&S.cp[k].pass)return 'done';
  return (S.lv[k]&&S.lv[k].done)?'open':'locked';
}
function nextTarget(){
  for(let n=1;n<=TOTAL;n++){
    if(!(S.lv[n]&&S.lv[n].done))return levelStatus(n)==='open'?{t:'level',n}:null;
    if(n%2===0&&!(S.cp[n]&&S.cp[n].pass))return {t:'cp',k:n};
  }
  return null;
}

/* ====== question building ====== */
function distractors(it,key,max,count,sim){
  let pool=VOCAB.filter(x=>x.id!==it.id&&x.n<=Math.max(max,it.n)&&x[key]!==it[key]);
  const seen=new Set();pool=pool.filter(x=>{if(seen.has(x[key]))return false;seen.add(x[key]);return true;});
  if(sim)pool=pool.map(x=>[x,Math.abs(sim(x)-sim(it))+Math.random()*1.6]).sort((a,b)=>a[1]-b[1]).map(a=>a[0]);
  else pool=shuffle(pool);
  return pool.slice(0,count);
}
const jpOpt=it=>it.kanji?`<span class="jp-opt" lang="ja">${esc(it.jp)}</span><small lang="ja">${esc(it.kana)}</small>`:`<span class="jp-opt" lang="ja">${esc(it.jp)}</span>`;
function buildV(it,qt,max){
  const q={itemId:it.id,qt,kind:'mc',cls:'two'};
  if(qt==='jp2vi'){
    q.head='Từ này nghĩa là gì?';q.pcls='jp';q.promptHtml=`<span lang="ja">${esc(it.jp)}</span>`;
    q.opts=shuffle([{txt:it.vi,html:esc(it.vi),ok:true}].concat(distractors(it,'vi',max,3).map(d=>({txt:d.vi,html:esc(d.vi),ok:false}))));
    q.promptText=it.jp;q.correctText=it.vi;
  }else if(qt==='vi2jp'){
    q.head='Chọn từ tiếng Nhật có nghĩa này';q.pcls='vi';q.promptHtml=esc(it.vi);
    q.opts=shuffle([{txt:it.kanji?it.jp+'（'+it.kana+'）':it.jp,html:jpOpt(it),ok:true}].concat(distractors(it,'jp',max,3).map(d=>({txt:d.kanji?d.jp+'（'+d.kana+'）':d.jp,html:jpOpt(d),ok:false}))));
    q.promptText=it.vi;q.correctText=it.kanji?it.jp+'（'+it.kana+'）':it.jp;
  }else if(qt==='read'){
    q.head='Chọn cách đọc đúng';q.pcls='jp';q.promptHtml=`<span lang="ja">${esc(it.jp)}</span>`;
    const ds=distractors(Object.assign({},it),'kana',max,3,x=>x.kana.length);
    q.opts=shuffle([{txt:it.kana,html:`<span class="jp-opt" lang="ja">${esc(it.kana)}</span>`,ok:true}].concat(ds.map(d=>({txt:d.kana,html:`<span class="jp-opt" lang="ja">${esc(d.kana)}</span>`,ok:false}))));
    q.promptText=it.jp;q.correctText=it.kana;
  }else{
    q.kind='type';q.cls='';q.head='Gõ cách đọc (hiragana hoặc romaji)';q.pcls='jp';q.promptHtml=`<span lang="ja">${esc(it.jp)}</span>`;
    q.ans=normK(it.kana);q.promptText=it.jp;q.correctText=it.kana;q.draft='';
  }
  return q;
}
const blankify=h=>h.replace(/＿＿/g,'<span class="blank" role="img" aria-label="chỗ trống"></span>');
function buildG(it,qm,stage){
  const qs=it.qs;let idx;
  if(qm==='stage')idx=Math.min(stage,1);else if(qm==='boss')idx=2;else idx=Math.floor(Math.random()*qs.length);
  idx=idx%qs.length;
  const s=qs[idx];
  const full=s.s||(s.p.indexOf('＿＿')>=0?s.p.replace('＿＿',s.o[0]):'');
  return {itemId:it.id,qt:'g',kind:'mc',cls:'',head:s.h||'Chọn đáp án đúng',pcls:'sent',promptHtml:blankify(esc(s.p)),full,fullVi:s.vi||'',
    opts:shuffle(s.o.map((t,k)=>({txt:t,html:`<span lang="ja">${esc(t)}</span>`,ok:k===0}))),promptText:s.p,correctText:s.o[0],why:s.w};
}
function buildQ(it,qm,stage,max){
  if(it.t==='g')return buildG(it,qm,stage);
  let d;
  if(qm==='stage')d=Math.min(3,stage+1);
  else if(qm==='box'){const b=(S.it[it.id]||{}).b||0;d=b<=1?1:b<=3?2:3;if(Math.random()<.25)d=Math.max(1,d-1);}
  else d=1+Math.floor(Math.random()*3);
  let qt;
  if(d===1)qt=qm==='stage'?'jp2vi':(Math.random()<.5?'jp2vi':'vi2jp');
  else if(d===2)qt=it.kanji?((qm==='stage'?it.i%2:Math.random()<.5)?'read':'vi2jp'):'vi2jp';
  else qt=it.kanji?'type':'vi2jp';
  return buildV(it,qt,max);
}

/* ====== run engine ====== */
function mkRun(o){
  const r={o,queue:shuffle(o.ids),got:{},log:[],seen:{},cur:null,fb:null,steps:0};
  o.ids.forEach(id=>{r.got[id]=0;});
  return r;
}
function curQ(r){
  if(!r.cur){const id=r.queue[0];r.cur=buildQ(ITEM[id],r.o.qm,r.got[id],r.o.max);r.cur.hinted=false;}
  return r.cur;
}
function answer(r,resp){
  if(r.fb)return;
  const q=r.cur,id=q.itemId;
  let ok,given;
  if(q.kind==='mc'){const o=q.opts[resp];ok=o.ok;given=o.txt;}
  else if(resp===null){ok=false;given='(không biết)';}
  else{const t=normK(resp);given=t||'(để trống)';ok=!!t&&t===q.ans;}
  const good=ok&&!q.hinted;
  r.fb={ok,good,given};
  const first=!r.seen[id];r.seen[id]=1;
  r.log.push({id,ok,good,given,qt:q.qt,promptText:q.promptText,correctText:q.correctText,first});
  const rc=rec(id);if(good)rc.c++;else if(!ok)rc.w++;
  if(good)award(5);
  save();
}
function advance(r){
  const q=r.cur,id=q.itemId,f=r.fb;
  r.queue.shift();
  if(r.o.requeue){
    if(f.good)r.got[id]++;else if(!f.ok)r.got[id]=0;
    if(!f.good||r.got[id]<r.o.need(id)){r.queue.splice(Math.min(r.queue.length,f.ok?4:3),0,id);}
  }
  r.cur=null;r.fb=null;r.sel=null;r.steps++;
  return r.queue.length===0;
}
function progress(r){
  const ids=r.o.ids;
  if(!r.o.requeue)return (ids.length-r.queue.length)/ids.length;
  let s=0,t=0;ids.forEach(id=>{const n=r.o.need(id);s+=Math.min(r.got[id],n);t+=n;});
  return t?s/t:1;
}
function summarize(r){
  const rows=r.log.filter(x=>x.first);
  const correct=rows.filter(x=>x.good).length;
  return {rows,correct,total:rows.length,pct:rows.length?Math.round(100*correct/rows.length):0};
}

/* ====== rich text ====== */
function rich(src){
  let h=esc(src);
  h=h.replace(/\[\[([gv]?)(\d+)\|([\s\S]*?)\]\]/g,(m,t,i,inner)=>`<span class="hl ${t==='g'?'hg':'hv'}" role="button" tabindex="0" data-a="hl" data-k="${t||'v'}${i}">${inner}</span>`);
  h=h.replace(/\{([^|{}]+)\|([^{}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>');
  return h;
}
const sentHtml=(jp,vi,lab)=>jp?`<div class="sent-tr"><p class="eyebrow">${lab||'Cả câu và nghĩa'}</p><p lang="ja" class="st-jp">${esc(jp)} ${spkBtn(jp)}</p>${vi?`<p class="st-vi">${esc(vi)}</p>`:''}</div>`:'';

function go(){UI.scroll=true;render();}
function autoSay(){try{const it=ITEM[levelItems(SES.n)[SES.card]];if(it&&it.t==='v')speak(it.jp);}catch(e){}}

/* ====== home ====== */
function stationHtml(L){
  const st=levelStatus(L.n),r=S.lv[L.n]||{};
  return `<li class="stn ${st}"><button class="stn-b" data-a="open-level" data-n="${L.n}" ${st==='locked'?'disabled':''}><span class="node">${st==='done'?IC.check:st==='locked'?IC.lock:L.n}</span><span class="stn-t"><span class="stn-code">Ga ${pad(L.n)} · Tuần ${L.week}</span><strong>${esc(L.title)}</strong><span class="muted">${L.vocab.length} từ · ${L.gram.length} mẫu ngữ pháp</span></span><span>${st==='done'?starsHtml(r.st||1):''}</span></button></li>`;
}
function cpHtml(k){
  const st=cpStatus(k),r=S.cp[k]||{};
  const range=k===2?'Ga 1–2':'Ga 1–'+k;
  return `<li class="stn cpn ${st}"><button class="stn-b" data-a="open-cp" data-k="${k}" ${st==='locked'?'disabled':''}><span class="node">${st==='done'?IC.check:st==='locked'?IC.lock:'★'}</span><span class="stn-t"><span class="stn-code">Kiểm tra định kỳ</span><strong>Ôn lại ${range}</strong><span class="muted">${st==='done'?'Đã qua ('+r.pct+'%)':'Đạt từ 80% mới mở ga tiếp theo'}</span></span><span></span></button></li>`;
}
function viewHome(){
  const nt=nextTarget(),due=dueIds().length;
  let go;
  if(nt&&nt.t==='level'){const L=LV[nt.n-1];const started=S.lv[nt.n]&&S.lv[nt.n].learned;
    go=`<p class="eyebrow">Ga tiếp theo</p><h2>Ga ${pad(L.n)} · ${esc(L.title)}</h2><div class="pills"><span class="pill">${L.vocab.length} từ</span><span class="pill">${L.gram.length} mẫu ngữ pháp</span><span class="pill">1 bài đọc</span><span class="pill">khoảng 10–15 phút</span></div><button class="btn primary" data-a="open-level" data-n="${L.n}">${started?'Học tiếp':'Vào học'}</button>`;
  }else if(nt&&nt.t==='cp'){
    go=`<p class="eyebrow">Bắt buộc trước khi sang ga mới</p><h2>Kiểm tra định kỳ: ôn lại Ga 1–${nt.k}</h2><p class="muted">16 câu trộn từ các ga đã học. Cần đúng ít nhất 13 câu.</p><button class="btn primary" data-a="open-cp" data-k="${nt.k}">Làm bài kiểm tra</button>`;
  }else go=`<p class="eyebrow">Hoàn thành tuyến</p><h2>Bạn đã đi hết 16 ga</h2><p class="muted">Giữ trí nhớ bằng cách ôn đều các từ đến hạn mỗi ngày.</p>`;
  const dueCard=due?`<div class="panel flat due-card"><div><div class="due-n">${due}</div><div class="muted">mục đến hạn ôn</div></div><button class="btn line" data-a="rv-start" data-m="due">Ôn ngay</button></div>`:'';
  let route='';
  for(let p=0;p<4;p++){
    const ls=LV.filter(L=>Math.min(3,Math.floor((L.n-1)/4))===p);
    if(!ls.length)continue;
    const ph=PH[p];
    route+=`<section class="phase" style="--lc:var(${ph.c})"><div class="phase-h"><span class="phase-tag">${ph.name}</span><h2>${ph.sub}</h2><span class="muted">Tuần ${ls[0].week}–${ls[ls.length-1].week}</span></div><ol class="line">`;
    ls.forEach(L=>{route+=stationHtml(L);if(L.n%2===0)route+=cpHtml(L.n);});
    route+='</ol></section>';
  }
  return `<div class="stack"><section class="panel today"><div class="today-go">${go}</div></section>${dueCard}</div>${route}`;
}

/* ====== session frame ====== */
function frame(title,stepIdx,inner){
  const stp=stepIdx==null?'':`<ol class="stepper">${STEPS.map((s,i)=>`<li class="${i<stepIdx?'past':i===stepIdx?'now':''}">${s}</li>`).join('')}</ol><div class="stepper-l"><span class="on">${STEPS[stepIdx]}</span><span>${stepIdx+1}/${STEPS.length}</span></div>`;
  const conf=SES.confirm?`<div class="confirm" role="alertdialog" aria-label="Xác nhận thoát"><p>Thoát bây giờ? Các từ bạn đã học vẫn được lưu, nhưng lượt làm này sẽ bắt đầu lại.</p><div class="row-btns"><button class="btn line sm" data-a="exit-no">Ở lại</button><button class="btn danger sm" data-a="exit-yes">Thoát</button></div></div>`:'';
  return `<div class="ses-top"><button class="btn ghost sm" data-a="exit" aria-label="Thoát">${IC.back} Thoát</button><div class="ses-title"><span class="eyebrow">${esc(title)}</span>${stp}</div></div>${conf}${inner}`;
}
function viewSes(){
  if(SES.kind==='level')return viewLevel();
  if(SES.kind==='cp')return viewCp();
  return viewRv();
}

/* ====== level flow ====== */
function viewLevel(){
  const L=LV[SES.n-1],t='Ga '+pad(L.n)+' · '+L.title;
  switch(SES.step){
    case 'intro':return viewIntro(L);
    case 'learn':return frame(t,0,viewLearn(L));
    case 'practice':return frame(t,1,viewRunBody('Luyện tập: mỗi mục phải đúng đủ số lần mới qua'));
    case 'fix':return frame(t,1,viewRunBody('Luyện lại các mục bạn vừa sai'));
    case 'gate':return frame(t,2,viewGate(L));
    case 'boss':return frame(t,2,viewRunBody('Bài kiểm tra qua màn'));
    case 'summary':return frame(t,3,viewSummary(SES.res,{pass:SES.res.pass,title:SES.res.pass?'Bạn đã qua màn!':'Chưa qua màn',sub:SES.res.pass?`Đúng ${SES.res.correct}/${SES.res.total} câu. Xem lại các câu sai rồi sang bài đọc hiểu.`:`Cần đúng ít nhất ${Math.ceil(PASS*SES.res.total)}/${SES.res.total} câu. Luyện lại các mục sai rồi làm lại bài kiểm tra.`}));
    case 'reading':return frame(t,4,viewReading(L));
    case 'done':return viewDone(L);
  }
  return '';
}
function viewIntro(L){
  const r=S.lv[L.n]||{};
  const ph=phaseOf(L.n);
  return `<div class="ses-top"><button class="btn ghost sm" data-a="exit">${IC.back} Về tuyến</button></div><div class="stack" style="--lc:var(${ph.c})"><section class="panel stack"><p class="eyebrow">Ga ${pad(L.n)} · Tuần ${L.week}</p><h1 style="font:800 1.7rem/1.25 var(--f-ui)">${esc(L.title)}</h1>
  <div class="chips">${L.vocab.map(a=>`<span class="pill" lang="ja">${esc(a[0])}</span>`).join('')}</div>
  <div class="chips">${L.gram.map(g=>`<span class="pill hv" lang="ja">${esc(g.ti)}</span>`).join('')}</div>
  <ol class="muted" style="margin:0;padding-left:20px;font-size:.95rem"><li>Học thẻ: nghĩa, cách nhớ, ví dụ.</li><li>Luyện tập: mỗi từ đúng 3 lần, mỗi mẫu ngữ pháp đúng 2 lần. Sai thì làm lại từ đầu mục đó.</li><li>Bài kiểm tra qua màn: cần đúng từ 80%.</li><li>Tổng kết câu đúng và câu sai.</li><li>Bài đọc hiểu dùng các từ vừa học.</li></ol>
  ${r.done?`<p class="note-s">Đã hoàn thành: ${starsHtml(r.st||1)} · bài đọc ${r.rd?r.rd[0]+'/'+r.rd[1]:'-'}</p>`:''}
  <div class="row-btns"><button class="btn primary" data-a="learn-start">${r.learned?'Xem lại thẻ học':'Bắt đầu học'}</button>${r.learned?'<button class="btn line" data-a="practice-start">Vào luyện tập</button>':''}</div></section></div>`;
}
function viewLearn(L){
  const ids=levelItems(SES.n),i=SES.card,it=ITEM[ids[i]],last=i===ids.length-1;
  let card;
  if(it.t==='v'){
    card=`<article class="card"><p class="eyebrow">Từ vựng · ${i+1}/${ids.length}</p><div class="jp-big" lang="ja">${esc(it.jp)}</div>${it.kanji?`<div class="kana-row" lang="ja">${esc(it.kana)}</div>`:''}${pron(it.kana,it.jp)}${voiceNote()}<div class="meaning">${esc(it.vi)}</div>${it.hv?`<div class="chips" style="justify-content:center"><span class="pill hv">Hán Việt · ${esc(it.hv)}</span></div>`:''}${tipHtml(it)}<div class="ex"><div class="ex-i"><p lang="ja">${esc(it.ex)} ${spkBtn(it.ex)}</p><p>${esc(it.exVi)}</p></div></div></article>`;
  }else{
    card=`<article class="card"><p class="eyebrow">Ngữ pháp · ${i+1}/${ids.length}</p><h2 class="g-title" lang="ja">${esc(it.ti)}</h2><div class="g-form" lang="ja">${esc(it.fo)}</div><div class="meaning">${esc(it.me)}</div>${tipHtml(it)}<div class="ex">${it.ex.map(e=>`<div class="ex-i"><p lang="ja">${esc(e[0])} ${spkBtn(e[0])}</p><p>${esc(e[1])}</p></div>`).join('')}</div>${it.wa?`<div class="warn"><b>Dễ nhầm:</b> ${esc(it.wa)}</div>`:''}</article>`;
  }
